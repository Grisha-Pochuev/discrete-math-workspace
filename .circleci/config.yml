version: 2.1

jobs:
  prepare-short-pool:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Verify immutable input
          command: |
            set -euo pipefail
            python3 - <<'PY'
            import json
            from pathlib import Path
            spec = json.loads(Path("sixth approach/specs/run-059-fine-rescue.json").read_text())
            assert spec["run_id"] == "run-059"
            assert spec["provider"] == "circleci"
            assert spec["trigger_tag"] == "ci-run-059"
            assert spec["resource_class"] == "large"
            assert spec["jobs"] == 32
            assert spec["groups_per_cell"] == 8
            assert spec["workers_per_job"] == 4
            assert spec["shard_count"] == 32
            assert len(spec["cells"]) == 4
            PY
      - restore_cache:
          keys:
            - short-pool-toolkit-v1
      - run:
          name: Prepare pinned toolkit
          command: |
            set -euo pipefail
            cache_root="$HOME/ci-cache"
            mkdir -p "$cache_root"
            if [ ! -d "$cache_root/python/sympy" ]; then
              python3 -m pip install --disable-pip-version-check \
                --target "$cache_root/python" 'sympy==1.13.3'
            fi
            if [ ! -f "$cache_root/or-tools/lib/cmake/ortools/ortoolsConfig.cmake" ]; then
              archive="$(mktemp)"
              curl --fail --location --retry 3 \
                'https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz' \
                --output "$archive"
              echo '6f389320672cee00b78aacefb2bde33fef0bb988c3b2735573b9fffd1047fbda  '"$archive" | sha256sum --check
              mkdir -p "$cache_root/or-tools"
              tar -xzf "$archive" -C "$cache_root/or-tools" --strip-components=1
              rm -f "$archive"
            fi
      - save_cache:
          key: short-pool-toolkit-v1
          paths:
            - ~/ci-cache
      - run:
          name: Compile the shared worker
          command: |
            set -euo pipefail
            cmake \
              -S "$CIRCLE_WORKING_DIRECTORY/sixth approach/run033_native" \
              -B /tmp/frontier-build \
              -DCMAKE_PREFIX_PATH="$HOME/ci-cache/or-tools" \
              -Dortools_DIR="$HOME/ci-cache/or-tools/lib/cmake/ortools" \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/frontier-build --parallel 2
            test -x /tmp/frontier-build/run033_boundary_worker
      - run:
          name: Record neutral diagnostics
          command: |
            mkdir -p diagnostics
            {
              date -u +%FT%TZ
              uname -a
              nproc
              lscpu
              free -h
              df -h .
              g++ --version
              cmake --version
              python3 --version
              node --version
              echo "CIRCLE_SHA1=$CIRCLE_SHA1"
              echo "CIRCLE_TAG=${CIRCLE_TAG:-}"
              sha256sum /tmp/frontier-build/run033_boundary_worker
            } > diagnostics/prepare.log
      - store_artifacts:
          path: diagnostics
          destination: prepare-diagnostics

  short-group:
    parameters:
      cell:
        type: string
      group:
        type: integer
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      CELL: << parameters.cell >>
      GROUP: << parameters.group >>
      RESOURCE_CLASS_NAME: large
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - checkout
      - restore_cache:
          keys:
            - short-pool-toolkit-v1
      - run:
          name: Compile the shared worker
          command: |
            set -euo pipefail
            test -f "$HOME/ci-cache/or-tools/lib/cmake/ortools/ortoolsConfig.cmake"
            test -d "$HOME/ci-cache/python/sympy"
            cmake \
              -S "$CIRCLE_WORKING_DIRECTORY/sixth approach/run033_native" \
              -B /tmp/frontier-build \
              -DCMAKE_PREFIX_PATH="$HOME/ci-cache/or-tools" \
              -Dortools_DIR="$HOME/ci-cache/or-tools/lib/cmake/ortools" \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/frontier-build --parallel 2
            test -x /tmp/frontier-build/run033_boundary_worker
      - run:
          name: Resolve the immutable matrix cell
          command: |
            set -euo pipefail
            mkdir -p out/audits
            case "$CELL" in
              c3-s63) case_id=3; support=63 ;;
              c3-s64) case_id=3; support=64 ;;
              c9-s63) case_id=9; support=63 ;;
              c9-s64) case_id=9; support=64 ;;
              *) echo 'invalid neutral cell' >&2; exit 2 ;;
            esac
            python3 - "$case_id" "$support" > out/cell.env <<'PY'
            import json
            import shlex
            import sys
            from pathlib import Path
            case_id, support = map(int, sys.argv[1:])
            spec = json.loads(Path("sixth approach/specs/run-059-fine-rescue.json").read_text())
            cells = [item for item in spec["cells"] if item["case"] == case_id and item["support"] == support]
            assert len(cells) == 1
            cell = cells[0]
            values = {
                "RUN_ID": spec["run_id"],
                "AUDIT_RUN_ID": spec["audit_run_id"],
                "CASE_ID": case_id,
                "SUPPORT": support,
                "ORBIT": cell["orbit"],
                "MISSING_TYPE": cell["missing_type"],
                "SHARD_COUNT": spec["shard_count"],
                "WORKERS_PER_JOB": spec["workers_per_job"],
                "WORKER_SECONDS": spec["worker_seconds"],
                "WORKER_CAP": spec["worker_cap"],
                "WORKER_MEMORY_MIB": spec["worker_memory_mib"],
                "CHECKPOINT_EVERY": spec["checkpoint_every"],
                "CHECKPOINT_SECONDS": spec["checkpoint_seconds"],
            }
            for key, value in values.items():
                print(f"{key}={shlex.quote(str(value))}")
            PY
      - run:
          name: Record machine diagnostics
          command: |
            set -euo pipefail
            source out/cell.env
            {
              date -u +%FT%TZ
              uname -a
              nproc
              lscpu
              free -h
              swapon --show
              df -h .
              ulimit -a
              g++ --version
              echo "CIRCLE_SHA1=$CIRCLE_SHA1"
              echo "CIRCLE_TAG=${CIRCLE_TAG:-}"
              echo "CELL=$CELL"
              echo "GROUP=$GROUP"
              sha256sum /tmp/frontier-build/run033_boundary_worker
            } > out/diagnostics.log
      - run:
          name: Start bounded resource monitor
          command: |
            (
              while true; do
                date -u +%FT%TZ
                grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
                ps -eo pid,ppid,rss,etime,cmd --sort=-rss | head -25
                sleep 60
              done
            ) > out/resource-monitor.log 2>&1 &
            echo $! > out/resource-monitor.pid
      - run:
          name: Run four independent fine shards
          command: |
            set +e
            source out/cell.env
            export LD_LIBRARY_PATH="$HOME/ci-cache/or-tools/lib:${LD_LIBRARY_PATH:-}"
            pids=()
            first_shard=$((GROUP * WORKERS_PER_JOB))
            for offset in 0 1 2 3; do
              shard=$((first_shard + offset))
              (
                ulimit -v $((WORKER_MEMORY_MIB * 1024))
                timeout --signal=TERM --kill-after=30s $((WORKER_SECONDS + 60)) \
                  /tmp/frontier-build/run033_boundary_worker \
                    --run-id "$RUN_ID" \
                    --symmetry-break 1 \
                    --case "$CASE_ID" \
                    --support "$SUPPORT" \
                    --shard-id "$shard" \
                    --shard-count "$SHARD_COUNT" \
                    --seconds "$WORKER_SECONDS" \
                    --cap "$WORKER_CAP" \
                    --checkpoint-every "$CHECKPOINT_EVERY" \
                    --checkpoint-seconds "$CHECKPOINT_SECONDS" \
                    --output "out/shard-$shard.json" \
                  > "out/shard-$shard.log" 2>&1
                echo $? > "out/shard-$shard.exit"
              ) &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do
              wait "$pid"
            done
            exit 0
      - run:
          name: Stop monitor and audit every completed shard
          when: always
          command: |
            set +e
            if [ -f out/resource-monitor.pid ]; then
              kill "$(cat out/resource-monitor.pid)" 2>/dev/null || true
            fi
            source out/cell.env
            node 'sixth approach/run035_hnf_context.js' out/context.json
            audit_code=$?
            first_shard=$((GROUP * WORKERS_PER_JOB))
            for offset in 0 1 2 3; do
              shard=$((first_shard + offset))
              PYTHONPATH="$HOME/ci-cache/python" python3 'sixth approach/run035_hnf_audit.py' \
                --input "out/shard-$shard.json" \
                --context out/context.json \
                --run-id "$AUDIT_RUN_ID" \
                --source-run "$CIRCLE_PIPELINE_NUMBER" \
                --source-logical-run "$RUN_ID" \
                --expected-index "$CASE_ID" \
                --expected-orbit "$ORBIT" \
                --expected-support "$SUPPORT" \
                --expected-missing-type "$MISSING_TYPE" \
                --output "out/audits/audit-shard-$shard.json" \
                > "out/audits/audit-shard-$shard.log" 2>&1
              code=$?
              if [ "$code" -ne 0 ]; then audit_code="$code"; fi
            done
            bundle="circle-work/$RUN_ID/case-$CASE_ID/support-$SUPPORT/group-$GROUP"
            mkdir -p "$bundle/audits" "$bundle/logs" "$bundle/survivors"
            python3 'sixth approach/run059_group_audit.py' \
              --spec 'sixth approach/specs/run-059-fine-rescue.json' \
              --case "$CASE_ID" \
              --support "$SUPPORT" \
              --group "$GROUP" \
              --input-dir out \
              --audit-dir out/audits \
              --output "$bundle/group-summary.json" \
              --survivor-dir "$bundle/survivors" \
              --pipeline-number "$CIRCLE_PIPELINE_NUMBER" \
              --vcs-revision "$CIRCLE_SHA1" \
              --vcs-tag "${CIRCLE_TAG:-}" \
              --resource-class "$RESOURCE_CLASS_NAME" \
              > "$bundle/group-audit.log" 2>&1
            group_code=$?
            cp -f out/audits/*.json "$bundle/audits/" 2>/dev/null || true
            cp -f out/*.log out/*.exit out/cell.env "$bundle/logs/" 2>/dev/null || true
            cp -f out/audits/*.log "$bundle/logs/" 2>/dev/null || true
            if [ "$audit_code" -ne 0 ]; then exit "$audit_code"; fi
            exit "$group_code"
      - persist_to_workspace:
          root: circle-work
          paths:
            - run-059/case-*/support-*/group-*
      - store_artifacts:
          path: circle-work
          destination: short-group

  collect-short-pool:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: circle-work
      - run:
          name: Strictly collect compact coverage
          command: |
            set -euo pipefail
            archive="circle-result/run-059-${CIRCLE_PIPELINE_NUMBER}"
            python3 'sixth approach/run059_collect.py' \
              --spec 'sixth approach/specs/run-059-fine-rescue.json' \
              --input-root circle-work \
              --output-dir "$archive" \
              --pipeline-number "$CIRCLE_PIPELINE_NUMBER" \
              --vcs-revision "$CIRCLE_SHA1" \
              --vcs-tag "${CIRCLE_TAG:-}"
            (cd "$archive" && sha256sum -c checksums.sha256)
      - store_artifacts:
          path: circle-result
          destination: accepted-short-pool

workflows:
  short-pool-v1:
    jobs:
      - prepare-short-pool:
          filters: &run059-filters
            branches:
              ignore: /.*/
            tags:
              only: /^ci-run-059$/
      - short-group:
          name: short-<< matrix.cell >>-g<< matrix.group >>
          matrix:
            alias: short-groups
            parameters:
              cell: [c3-s63, c3-s64, c9-s63, c9-s64]
              group: [0, 1, 2, 3, 4, 5, 6, 7]
          requires:
            - prepare-short-pool
          filters: *run059-filters
      - collect-short-pool:
          requires:
            - short-groups
          filters: *run059-filters
