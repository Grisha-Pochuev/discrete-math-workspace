version: 2.1

parameters:
  run_e07:
    type: boolean
    default: false

jobs:
  e07-group:
    parameters:
      t:
        type: integer
      g:
        type: integer
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - checkout
      - run:
          name: build
          command: |
            set -euo pipefail
            mkdir -p out
            g++ -O3 -std=c++20 exp-07/src/w0.cpp -o /tmp/w0
            python3 -m py_compile exp-07/src/v0.py exp-07/src/c0.py
            { date -u +%FT%TZ; uname -a; nproc; lscpu; free -h; g++ --version; python3 --version; echo "CIRCLE_SHA1=$CIRCLE_SHA1"; } > out/machine.txt
      - run:
          name: compute
          command: |
            set -euo pipefail
            t='<< parameters.t >>'
            g='<< parameters.g >>'
            pids=()
            for k in 0 1 2 3; do
              shard=$((g*4+k))
              (
                /tmp/w0 "$t" "$shard" 20 1100 840 "out/near-$k.tsv" "out/summary-$k.json" 1e-10 > "out/worker-$k.log" 2>&1
              ) &
              pids+=("$!")
            done
            for p in "${pids[@]}"; do wait "$p"; done
            python3 exp-07/src/v0.py --type "$t" --input out/near-0.tsv out/near-1.tsv out/near-2.tsv out/near-3.tsv --output out/verified.json
            mkdir -p "work/t-$t/g-$g"
            cp -a out/. "work/t-$t/g-$g/"
      - persist_to_workspace:
          root: work
          paths:
            - t-*/g-*
      - store_artifacts:
          path: out
          destination: e07-group

  e07-collect:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: work
      - run:
          name: collect
          command: |
            set -euo pipefail
            mkdir -p result
            python3 exp-07/src/c0.py --root work --output result/summary.json
            tar -czf result/groups.tar.gz work
            sha256sum result/summary.json result/groups.tar.gz > result/checksums.sha256
      - store_artifacts:
          path: result
          destination: e07-result

workflows:
  e07:
    when: << pipeline.parameters.run_e07 >>
    jobs:
      - e07-group:
          name: e07-t<< matrix.t >>-g<< matrix.g >>
          matrix:
            alias: e07-groups
            parameters:
              t: [0, 1, 2, 3, 4, 5]
              g: [0, 1, 2, 3, 4]
      - e07-collect:
          requires:
            - e07-groups
