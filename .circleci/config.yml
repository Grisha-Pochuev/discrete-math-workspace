version: 2.1

jobs:
  r0-smoke:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - checkout
      - run:
          name: Build
          command: |
            set -euo pipefail
            g++ -O3 -std=c++20 exp-07/src/r0.cpp -o /tmp/r0
      - run:
          name: Diagnostics
          command: |
            set -euo pipefail
            mkdir -p out
            { date -u +%FT%TZ; uname -a; nproc; lscpu; free -h; g++ --version; echo "CIRCLE_SHA1=$CIRCLE_SHA1"; } > out/machine.txt
      - run:
          name: Smoke
          command: |
            set -euo pipefail
            pids=()
            for k in 0 1 2 3; do
              /tmp/r0 --worker "$k" --workers 4 --seconds 30 --seed 2026081701 --out "out/w-$k.json" > "out/w-$k.log" 2>&1 &
              pids+=("$!")
            done
            for p in "${pids[@]}"; do wait "$p"; done
            python3 exp-07/src/check.py out/w-*.json
            python3 - <<'PY'
            import glob,json
            total=0
            for p in glob.glob('out/w-*.json'):
                d=json.load(open(p)); total += d['attempts']
                assert d['workers']==4
                assert d['elapsed'] >= 25
            assert total > 1000, total
            print('attempts', total)
            PY
      - store_artifacts:
          path: out
          destination: r0-smoke

workflows:
  r0-smoke:
    jobs:
      - r0-smoke:
          filters:
            branches:
              only: r000-circle
