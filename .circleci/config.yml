version: 2.1

jobs:
  s0:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - checkout
      - run:
          name: build
          command: |
            set -euo pipefail
            mkdir -p out
            g++ -O3 -std=c++20 exp-07/src/w0.cpp -o /tmp/w0
            python3 -m py_compile exp-07/src/v0.py exp-07/src/c0.py
            { date -u +%FT%TZ; uname -a; nproc; lscpu; free -h; g++ --version; python3 --version; } > out/machine.txt
      - run:
          name: smoke
          command: |
            set -euo pipefail
            pids=()
            for k in 0 1 2 3; do
              /tmp/w0 0 "$k" 4 100 30 "out/near-$k.tsv" "out/summary-$k.json" 1e-10 > "out/worker-$k.log" 2>&1 &
              pids+=("$!")
            done
            for p in "${pids[@]}"; do wait "$p"; done
            python3 exp-07/src/v0.py --type 0 --input out/near-0.tsv out/near-1.tsv out/near-2.tsv out/near-3.tsv --output out/verified.json
            python3 - <<'PY'
            import json,glob
            ss=[json.load(open(p)) for p in glob.glob('out/summary-*.json')]
            assert len(ss)==4
            assert all(x['parameter_count']==1221 for x in ss)
            assert sum(x['processed_assigned_u'] for x in ss)==1221
            v=json.load(open('out/verified.json'))
            assert v['exact_cancellations']==0
            print({'workers':len(ss),'pairs':sum(x['pair_tests'] for x in ss),'ratio_hits':sum(x['ratio_hits'] for x in ss)})
            PY
      - store_artifacts:
          path: out
          destination: s0

workflows:
  s0:
    jobs:
      - s0:
          filters:
            branches:
              only: main
