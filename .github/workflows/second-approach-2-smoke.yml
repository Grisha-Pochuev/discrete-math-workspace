name: Second approach 2.0 smoke test

on:
  push:
    paths:
      - second-approach-2.0/adaptive_v2.py
      - second-approach-2.0/adaptive_parts/**
      - second-approach-2.0/engine.py
      - second-approach-2.0/runner.py
      - second-approach-2.0/collect.py
      - second-approach-2.0/verify_run.py
      - second-approach-2.0/requirements.txt
      - .github/workflows/second-approach-2-compute.yml
      - .github/workflows/second-approach-2-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-approach-2-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: second-approach-2.0/requirements.txt

      - name: Install dependencies with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check -r second-approach-2.0/requirements.txt; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Validate both lane plans, lineage classification, bound safety, and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            second-approach-2.0/adaptive_v2.py \
            second-approach-2.0/engine.py \
            second-approach-2.0/runner.py \
            second-approach-2.0/collect.py \
            second-approach-2.0/verify_run.py
          # The collector must remain importable in failed-job reruns that do
          # not install numerical dependencies.
          PYTHONPATH=second-approach-2.0 python -S -c 'import collect; assert callable(collect.collect_main)'
          PYTHONPATH=second-approach-2.0 python - <<'PY'
          from collections import Counter
          import numpy as np
          import engine
          import runner

          for version, expected in engine.LANE_PLANS.items():
              counts = Counter(
                  engine.lane_for(job, worker, version)
                  for job in range(20)
                  for worker in range(4)
              )
              assert dict(counts) == expected, (version, counts, expected)
              assert sum(counts.values()) == 80

          assert engine.is_independent_candidate({
              "candidate_id": "child",
              "lineage_root": "sa20-r000-fresh",
              "lane": "precision_audit",
              "legacy_rooted": False,
          })
          assert not engine.is_independent_candidate({
              "candidate_id": "old",
              "lineage_root": "r012-old",
              "lane": "precision_audit",
              "legacy_rooted": True,
          })

          raw = np.asarray([100 + 100j, -100 - 100j, 7.99 - 7.99j], dtype=np.complex128)
          safe, changed = runner.sanitize_initial_x(raw, 8.0)
          assert safe is not None
          assert changed >= 4
          assert np.max(np.abs(safe.real)) <= 7.6
          assert np.max(np.abs(safe.imag)) <= 7.6
          untouched, changed_none = runner.sanitize_initial_x(None, 8.0)
          assert untouched is None and changed_none == 0

          class RegressionModel:
              def __init__(self):
                  self.structured_initial_point = self._unsafe_start

              @staticmethod
              def _unsafe_start(*args, **kwargs):
                  return np.asarray([9.0, -9.0, 8.0, -8.0], dtype=float)

              def solve_support(self, mask, rng, **kwargs):
                  y0 = self.structured_initial_point(None, None, rng, 0.12)
                  assert np.all(y0 > -8.0), y0
                  assert np.all(y0 < 8.0), y0
                  return {"y0": y0}

          regression = RegressionModel()
          result, final_changed = runner.solve_support_with_bound_safe_start(
              regression,
              0,
              np.random.default_rng(1),
              max_nfev=1,
              scale=0.12,
              bound=8.0,
              initial_x=None,
          )
          assert final_changed == 4, (final_changed, result)
          assert regression.structured_initial_point == regression._unsafe_start
          print(engine.LANE_PLANS)
          PY

      - name: Exercise all version-2 lanes and the backward-compatible collector
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke-output smoke-artifacts smoke-repo
          mkdir -p smoke-output smoke-artifacts smoke-repo
          # Worker 0 of these jobs lands in each of the eight version-2 lanes.
          # Three bounded attempts avoid treating one unlucky numerical start
          # as a systematic lane failure, while retaining a strict short test.
          for job in 0 3 5 7 12 16 18 19; do
            echo "=== exercising job $job ==="
            set +e
            PYTHONPATH=second-approach-2.0 python second-approach-2.0/runner.py \
              --job-id "$job" \
              --run-index 9 \
              --base-seed 123456789 \
              --seconds 180 \
              --workers 1 \
              --max-attempts 3 \
              --max-nfev 60 \
              --lane-plan-version 2 \
              --legacy-strategy support_mutation \
              --independent-strategy balanced \
              --output "smoke-output/job-$job" \
              > "smoke-output/job-$job-driver.log" 2>&1
            runner_code="$?"
            set -e
            cat "smoke-output/job-$job-driver.log" || true
            find "smoke-output/job-$job" -name attempts.jsonl -type f \
              -exec sh -c 'echo --- "$1"; cat "$1"' _ {} \; 2>/dev/null || true
            cat "smoke-output/job-$job/manifest.json" 2>/dev/null || true
            test "$runner_code" -eq 0
            test -f "smoke-output/job-$job/manifest.json"
            candidate="$(find "smoke-output/job-$job" -name 'candidate-*.json.gz' -print -quit)"
            if [ -z "$candidate" ]; then
              echo "lane for job $job produced no candidate in three bounded attempts" >&2
              exit 1
            fi
            mkdir -p "smoke-artifacts/second-approach-2-data-$job"
            cp -a "smoke-output/job-$job/." "smoke-artifacts/second-approach-2-data-$job/"
          done

          cp -a second-approach-2.0 smoke-repo/
          PYTHONPATH=second-approach-2.0 python second-approach-2.0/collect.py \
            --artifacts smoke-artifacts \
            --repo smoke-repo \
            --run-id 1 \
            --conclusion success \
            --expected-jobs 8 \
            --min-jobs 8

          summary="$(find smoke-repo/second-approach-2.0/runs -path '*-1/summary.json' -print -quit)"
          test -n "$summary"
          run_dir="$(dirname "$summary")"
          python second-approach-2.0/verify_run.py "$run_dir"
          python - "$summary" <<'PY'
          import json
          import sys

          summary = json.load(open(sys.argv[1]))
          assert summary["accepted"]
          assert summary["lane_plan_version"] == 2
          assert summary["legacy_strategy"] == "support_mutation"
          assert summary["independent_strategy"] == "balanced"
          assert summary["promoted_candidates"] >= 8
          assert summary["distinct_support_fingerprints"] > 0
          assert summary["distinct_residual_basin_fingerprints"] > 0
          assert set(summary["lane_promoted_counts"]) == {
              "fresh_independent",
              "obstruction_boundary",
              "novelty_far",
              "independent_precision",
              "independent_mutation",
              "legacy_adaptive",
              "legacy_escape",
              "legacy_precision",
          }
          assert summary["inherited_independent_promoted"] >= 2
          assert summary["distinct_independent_lineage_roots"] > 0
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
