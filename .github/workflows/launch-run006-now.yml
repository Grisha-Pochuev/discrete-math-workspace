name: Launch repaired Fourth approach Run 006 now

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/launch-run006-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch Run 006 from current main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/fourth-approach-run006-manual.yml/dispatches" \
            -f ref=main
