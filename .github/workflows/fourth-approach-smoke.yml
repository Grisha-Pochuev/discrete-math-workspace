name: Fourth approach real-path smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'fourth-approach/schema.py'
      - 'fourth-approach/inventory.py'
      - 'fourth-approach/runner.py'
      - 'fourth-approach/collect.py'
      - 'fourth-approach/verify_run.py'
      - 'fourth-approach/tests/**'
      - 'fourth-approach/run-specs/**'
      - '.github/workflows/fourth-approach-smoke.yml'
      - '.github/workflows/fourth-approach-compute.yml'
      - '.github/workflows/fourth-approach-rescue.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: fourth-approach-smoke-v5
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Blobless partial clone of current source tree
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$TARGET_SHA"
          git sparse-checkout init --cone
          git sparse-checkout set fourth-approach
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Create diagnostic directory first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/artifacts smoke/repo/fourth-approach
          date -u +%FT%TZ > smoke/launch-status.txt
          printf '%s\n' "$GITHUB_SHA" > smoke/source-sha.txt
          {
            uname -a
            nproc
            free -h
            df -h .
            python --version
            git count-objects -vH
          } > smoke/machine.txt

      - name: Static checks and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            fourth-approach/schema.py \
            fourth-approach/inventory.py \
            fourth-approach/runner.py \
            fourth-approach/collect.py \
            fourth-approach/verify_run.py
          PYTHONPATH=fourth-approach python -m unittest discover \
            -s fourth-approach/tests -p 'test_*.py' -v | tee smoke/unit-tests.log
          PYTHONPATH=fourth-approach python - <<'PY' | tee smoke/config-validation.log
          from schema import matrix_json, read_json, validate_launch, validate_spec
          launch = validate_launch(read_json('fourth-approach/launch.json'))
          spec = validate_spec(read_json(launch['spec_path']), launch)
          print(launch)
          print(spec['title'])
          print(matrix_json(launch['jobs']))
          PY

      - name: Real runner path for all initial shards
        shell: bash
        run: |
          set -uo pipefail
          overall=0
          for shard in 0 1 2 3; do
            out="smoke/artifacts/fourth-approach-data-${shard}"
            mkdir -p "$out"
            printf '%s\n' "python fourth-approach/runner.py --task stage0_source_inventory --run-index 0 --shard-id ${shard} --shard-count 4 --source-ref HEAD" > "$out/command.txt"
            set +e
            PYTHONPATH=fourth-approach python fourth-approach/runner.py \
              --repo . \
              --spec fourth-approach/run-specs/run-000-stage0-source-inventory.json \
              --task stage0_source_inventory \
              --run-index 0 \
              --shard-id "$shard" \
              --shard-count 4 \
              --seconds 120 \
              --max-attempts 1 \
              --source-ref HEAD \
              --output "$out" \
              > "$out/driver.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$out/runner-exit-code.txt"
            if [ "$code" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"

      - name: Real collector and independent verifier path
        shell: bash
        run: |
          set -euo pipefail
          cp fourth-approach/control.json smoke/repo/fourth-approach/control.json
          PYTHONPATH=fourth-approach python fourth-approach/collect.py \
            --artifacts smoke/artifacts \
            --repo smoke/repo \
            --run-id 90000000000 \
            --source-sha "$GITHUB_SHA" \
            --expected-jobs 4 \
            --minimum-jobs 4 \
            --spec fourth-approach/run-specs/run-000-stage0-source-inventory.json \
            | tee smoke/collector.log
          PYTHONPATH=fourth-approach python fourth-approach/verify_run.py \
            smoke/repo/fourth-approach/runs/run-000-90000000000 \
            --require-accepted | tee smoke/verifier.log

      - name: Validate diagnostics and artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f smoke/launch-status.txt
          test -f smoke/machine.txt
          test -f smoke/unit-tests.log
          for shard in 0 1 2 3; do
            out="smoke/artifacts/fourth-approach-data-${shard}"
            test -f "$out/command.txt"
            test -f "$out/driver.log"
            test -f "$out/runner-exit-code.txt"
            test -f "$out/launch-status.json"
            test -f "$out/manifest.json"
            test -f "$out/records.json.gz"
          done
          test -f smoke/repo/fourth-approach/runs/run-000-90000000000/summary.json
          test -f smoke/repo/fourth-approach/runs/run-000-90000000000/checksums.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourth-approach-smoke-${{ github.run_id }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  record-and-continue:
    if: always()
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      TESTED_SHA: ${{ github.sha }}
      SMOKE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Blobless partial clone of current main state
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=20 --filter=blob:none origin main
          git sparse-checkout init --cone
          git sparse-checkout set fourth-approach
          git checkout -B main FETCH_HEAD

      - name: Record smoke result and atomically open one safe launch
        shell: bash
        run: |
          set -euo pipefail
          active_compute="$(gh run list --repo "$GH_REPO" --workflow fourth-approach-compute.yml --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)"
          active_conflict="$(gh run list --repo "$GH_REPO" --limit 100 \
            --json status,workflowName \
            --jq '[.[] | select(.status != "completed"
              and .workflowName != "Fourth approach real-path smoke"
              and .workflowName != "Fourth approach watchdog"
              and .workflowName != "Fourth approach compute")] | length' 2>/dev/null || echo 0)"

          rm -f /tmp/dispatch-fourth-compute
          pushed=0
          for attempt in 1 2 3 4; do
            git -c protocol.version=2 fetch --no-tags --depth=20 --filter=blob:none origin main
            git reset --hard origin/main
            ACTIVE_COMPUTE="$active_compute" ACTIVE_CONFLICT="$active_conflict" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).isoformat()
          smoke_result = os.environ["SMOKE_RESULT"]
          tested_sha = os.environ["TESTED_SHA"]
          smoke_run_id = int(os.environ["SMOKE_RUN_ID"])
          active_compute = int(os.environ["ACTIVE_COMPUTE"])
          active_conflict = int(os.environ["ACTIVE_CONFLICT"])

          root = Path("fourth-approach")
          status_path = root / "smoke-status.json"
          control_path = root / "control.json"
          launch_path = root / "launch.json"
          state_path = root / "watchdog-state.json"

          current_status = {}
          if status_path.exists():
              try:
                  current_status = json.loads(status_path.read_text(encoding="utf-8"))
              except Exception:
                  current_status = {}
          if int(current_status.get("workflow_run_id", -1)) <= smoke_run_id:
              status = {
                  "schema_version": 1,
                  "workflow": "Fourth approach real-path smoke",
                  "workflow_run_id": smoke_run_id,
                  "tested_sha": tested_sha,
                  "result": smoke_result,
                  "completed_at": now,
              }
              status_path.write_text(json.dumps(status, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          control = json.loads(control_path.read_text(encoding="utf-8"))
          launch = json.loads(launch_path.read_text(encoding="utf-8"))
          state = json.loads(state_path.read_text(encoding="utf-8"))

          state["last_checked_at"] = now
          state["last_observed_active_runs"] = {
              "compute": active_compute,
              "conflicts": active_conflict,
          }

          dispatch = False
          if smoke_result != "success":
              launch["enabled"] = False
              state["last_action"] = "recorded_failed_smoke"
              state["current_gate"] = "smoke_failed_requires_repair"
              state["consecutive_technical_failures"] = int(state.get("consecutive_technical_failures", 0)) + 1
          else:
              control["smoke_required"] = False
              control["smoke_verified_for_code_sha"] = tested_sha
              state["consecutive_technical_failures"] = 0
              if (
                  bool(control.get("tracking_enabled"))
                  and bool(control.get("full_run_auto_launch_allowed"))
                  and int(control.get("next_run_index", -1)) == int(launch.get("run_index", -2))
                  and not bool(launch.get("enabled"))
                  and active_compute == 0
                  and active_conflict == 0
              ):
                  launch["enabled"] = True
                  launch["nonce"] = f"fourth-run-{int(launch['run_index']):03d}-smoke-{smoke_run_id}"
                  control["recommended_next_action"] = "run_000_enabled_and_dispatched_after_green_smoke"
                  state["last_action"] = "enabled_next_run_after_green_smoke"
                  state["current_gate"] = "compute_dispatch_requested"
                  state["last_action_commit"] = tested_sha
                  state["dispatch_requested_for_nonce"] = launch["nonce"]
                  state["dispatch_requested_at"] = now
                  dispatch = True
              elif bool(launch.get("enabled")) and active_compute == 0 and active_conflict == 0:
                  state["last_action"] = "green_smoke_found_existing_enabled_launch"
                  state["current_gate"] = "compute_dispatch_requested"
                  state["dispatch_requested_for_nonce"] = launch["nonce"]
                  state["dispatch_requested_at"] = now
                  dispatch = True
              elif active_compute > 0:
                  state["last_action"] = "green_smoke_compute_already_active"
                  state["current_gate"] = "healthy_compute_active"
              else:
                  state["last_action"] = "green_smoke_waiting_for_concurrency"
                  state["current_gate"] = "waiting_for_repository_concurrency"

          control_path.write_text(json.dumps(control, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          launch_path.write_text(json.dumps(launch, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if dispatch:
              Path("/tmp/dispatch-fourth-compute").touch()
          PY

            if [ -z "$(git status --porcelain -- fourth-approach/smoke-status.json fourth-approach/control.json fourth-approach/launch.json fourth-approach/watchdog-state.json)" ]; then
              pushed=1
              break
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add fourth-approach/smoke-status.json fourth-approach/control.json fourth-approach/launch.json fourth-approach/watchdog-state.json
            git commit -m "record and gate Fourth approach smoke ${SMOKE_RUN_ID} ${SMOKE_RESULT}"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo 'failed to persist smoke state after four attempts' >&2
              exit 1
            fi
          done
          test "$pushed" = 1

          if [ -f /tmp/dispatch-fourth-compute ]; then
            sleep 2
            active_compute="$(gh run list --repo "$GH_REPO" --workflow fourth-approach-compute.yml --limit 20 \
              --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)"
            if [ "$active_compute" -eq 0 ]; then
              gh workflow run fourth-approach-compute.yml --repo "$GH_REPO" --ref main
              echo 'Dispatched Fourth approach compute after successful real-path smoke.' | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo 'Compute became active before dispatch; no duplicate created.' | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$SMOKE_RESULT" != "success" ]; then
            echo 'Smoke failed; launch remains disabled.' >&2
            exit 1
          fi
