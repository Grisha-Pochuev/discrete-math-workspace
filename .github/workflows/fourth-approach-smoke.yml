name: Fourth approach real-path smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'fourth-approach/schema.py'
      - 'fourth-approach/inventory.py'
      - 'fourth-approach/canonicalize.py'
      - 'fourth-approach/runner.py'
      - 'fourth-approach/collect.py'
      - 'fourth-approach/verify_run.py'
      - 'fourth-approach/tests/**'
      - 'fourth-approach/run-specs/**'
      - '.github/workflows/fourth-approach-smoke.yml'
      - '.github/workflows/fourth-approach-compute.yml'
      - '.github/workflows/fourth-approach-rescue.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: fourth-approach-smoke-v6
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Blobless sparse clone of current source tree
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$TARGET_SHA"
          git sparse-checkout init --cone
          git sparse-checkout set fourth-approach third-approach-2.0/runs
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Create diagnostic directory first
        run: |
          mkdir -p smoke/artifacts smoke/repo/fourth-approach
          date -u +%FT%TZ > smoke/launch-status.txt
          printf '%s\n' "$GITHUB_SHA" > smoke/source-sha.txt
          { uname -a; nproc; free -h; df -h .; python --version; git count-objects -vH; } > smoke/machine.txt

      - name: Static checks, ready-spec validation, and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            fourth-approach/schema.py \
            fourth-approach/inventory.py \
            fourth-approach/canonicalize.py \
            fourth-approach/runner.py \
            fourth-approach/collect.py \
            fourth-approach/verify_run.py
          PYTHONPATH=fourth-approach python -m unittest discover \
            -s fourth-approach/tests -p 'test_*.py' -v | tee smoke/unit-tests.log
          PYTHONPATH=fourth-approach python - <<'PY' | tee smoke/config-validation.log
          from schema import read_json, validate_launch, validate_spec
          launch = validate_launch(read_json('fourth-approach/launch.json'))
          spec = validate_spec(read_json(launch['spec_path']), launch, require_ready=True)
          print(launch)
          print(spec['title'])
          PY

      - name: Exercise real runner path on four bounded shards
        shell: bash
        run: |
          set -euo pipefail
          task="$(jq -r .task fourth-approach/launch.json)"
          run_index="$(jq -r .run_index fourth-approach/launch.json)"
          spec="$(jq -r .spec_path fourth-approach/launch.json)"
          for shard in 0 1 2 3; do
            out="smoke/artifacts/fourth-approach-data-${shard}"
            mkdir -p "$out"
            printf '%s\n' "runner task=${task} run=${run_index} shard=${shard}/4 max_attempts=2" > "$out/command.txt"
            set +e
            PYTHONPATH=fourth-approach python fourth-approach/runner.py \
              --repo . \
              --spec "$spec" \
              --task "$task" \
              --run-index "$run_index" \
              --shard-id "$shard" \
              --shard-count 4 \
              --seconds 900 \
              --max-attempts 2 \
              --source-ref HEAD \
              --output "$out" \
              > "$out/driver.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$out/runner-exit-code.txt"
            test "$code" -eq 0
            test -f "$out/manifest.json"
            test -f "$out/records.json.gz"
          done

      - name: Exercise real collector and independent archive verifier
        shell: bash
        run: |
          set -euo pipefail
          run_index="$(jq -r .run_index fourth-approach/launch.json)"
          spec="$(jq -r .spec_path fourth-approach/launch.json)"
          PYTHONPATH=fourth-approach python fourth-approach/collect.py \
            --artifacts smoke/artifacts \
            --repo smoke/repo \
            --run-id 90000000001 \
            --source-sha "$GITHUB_SHA" \
            --expected-jobs 4 \
            --minimum-jobs 4 \
            --spec "$spec" \
            --smoke | tee smoke/collector.log
          run_dir="smoke/repo/fourth-approach/runs/run-$(printf '%03d' "$run_index")-90000000001"
          PYTHONPATH=fourth-approach python fourth-approach/verify_run.py \
            "$run_dir" --require-accepted | tee smoke/verifier.log

      - name: Validate mandatory diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f smoke/launch-status.txt
          test -f smoke/machine.txt
          test -f smoke/unit-tests.log
          for shard in 0 1 2 3; do
            out="smoke/artifacts/fourth-approach-data-${shard}"
            for name in command.txt driver.log runner-exit-code.txt launch-status.json manifest.json records.json.gz; do
              test -f "$out/$name"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourth-approach-smoke-${{ github.run_id }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  record-and-continue:
    if: always()
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      TESTED_SHA: ${{ github.sha }}
      SMOKE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Blobless sparse clone of current main state
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=30 --filter=blob:none origin main
          git sparse-checkout init --cone
          git sparse-checkout set fourth-approach
          git checkout -B main FETCH_HEAD

      - name: Record result, open one launch, and explicitly dispatch compute
        shell: bash
        run: |
          set -euo pipefail
          active_compute="$(gh run list --repo "$GH_REPO" --workflow fourth-approach-compute.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')"
          active_large="$(gh run list --repo "$GH_REPO" --limit 100 --json status,workflowName --jq '[.[] | select(.status != "completed" and (.workflowName == "Third approach 2.0 proof search" or .workflowName == "Third approach proof search" or .workflowName == "Second approach compute" or .workflowName == "Second approach 2.0 compute"))] | length')"
          for attempt in 1 2 3 4; do
            git -c protocol.version=2 fetch --no-tags --depth=30 --filter=blob:none origin main
            git reset --hard origin/main
            ACTIVE_COMPUTE="$active_compute" ACTIVE_LARGE="$active_large" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from sys import path
          path.insert(0, 'fourth-approach')
          from schema import read_json, validate_launch, validate_spec

          root = Path('fourth-approach')
          now = datetime.now(timezone.utc).isoformat()
          result = os.environ['SMOKE_RESULT']
          run_id = int(os.environ['SMOKE_RUN_ID'])
          tested_sha = os.environ['TESTED_SHA']
          control = read_json(root / 'control.json')
          launch = validate_launch(read_json(root / 'launch.json'))
          validate_spec(read_json(launch['spec_path']), launch, require_ready=True)
          state = read_json(root / 'watchdog-state.json')
          status = {
              'schema_version': 1,
              'workflow': 'Fourth approach real-path smoke',
              'workflow_run_id': run_id,
              'tested_sha': tested_sha,
              'result': result,
              'completed_at': now,
              'run_index': launch['run_index'],
              'task': launch['task'],
          }
          (root / 'smoke-status.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          state['last_checked_at'] = now
          state['last_observed_active_runs'] = {'compute': int(os.environ['ACTIVE_COMPUTE']), 'large_conflicts': int(os.environ['ACTIVE_LARGE'])}
          if result != 'success':
              launch['enabled'] = False
              control['smoke_required'] = True
              state['last_action'] = 'recorded_failed_smoke'
              state['current_gate'] = 'smoke_failed_requires_repair'
              state['consecutive_technical_failures'] = int(state.get('consecutive_technical_failures', 0)) + 1
          elif int(control['next_run_index']) != int(launch['run_index']):
              launch['enabled'] = False
              state['last_action'] = 'blocked_smoke_due_to_state_mismatch'
              state['current_gate'] = 'repair_control_launch_alignment'
          elif int(os.environ['ACTIVE_COMPUTE']) or int(os.environ['ACTIVE_LARGE']):
              launch['enabled'] = False
              control['smoke_required'] = False
              control['smoke_verified_for_code_sha'] = tested_sha
              state['last_action'] = 'green_smoke_compute_deferred_for_concurrency'
              state['current_gate'] = 'await_free_concurrency'
          elif control.get('last_run_index') is not None and int(control['last_run_index']) >= int(launch['run_index']):
              launch['enabled'] = False
              state['last_action'] = 'green_smoke_but_run_already_accepted'
              state['current_gate'] = 'prepare_next_stage'
          else:
              launch['enabled'] = True
              launch['nonce'] = f"fourth-run-{int(launch['run_index']):03d}-smoke-{run_id}"
              control['smoke_required'] = False
              control['smoke_verified_for_code_sha'] = tested_sha
              control['recommended_next_action'] = 'compute_dispatch_requested_after_green_smoke'
              state['last_action'] = 'enabled_and_requested_compute_after_green_smoke'
              state['current_gate'] = 'compute_dispatch_requested'
              state['dispatch_requested_for_nonce'] = launch['nonce']
              state['dispatch_requested_at'] = now
              Path('/tmp/dispatch-fourth-compute').write_text('1')
          (root / 'control.json').write_text(json.dumps(control, indent=2, sort_keys=True) + '\n')
          (root / 'launch.json').write_text(json.dumps(launch, indent=2, sort_keys=True) + '\n')
          (root / 'watchdog-state.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add fourth-approach/smoke-status.json fourth-approach/control.json fourth-approach/launch.json fourth-approach/watchdog-state.json
            if git diff --cached --quiet; then break; fi
            git commit -m "record and gate Fourth approach smoke ${SMOKE_RUN_ID} ${SMOKE_RESULT}"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
          done
          if [ -f /tmp/dispatch-fourth-compute ]; then
            gh workflow run fourth-approach-compute.yml --repo "$GH_REPO" --ref main
            echo 'Explicitly dispatched Fourth approach compute after green smoke.' >> "$GITHUB_STEP_SUMMARY"
          fi
