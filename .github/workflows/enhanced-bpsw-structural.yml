name: Enhanced BPSW structural search

on:
  push:
    branches:
      - enhanced-bpsw-structural-search-2026-08-15
    paths:
      - enhanced-bpsw/**
      - .github/workflows/enhanced-bpsw-structural.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-bpsw-structural-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explore-greene:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            enhanced-bpsw
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mathematical dependencies
        run: python -m pip install --disable-pip-version-check sympy requests
      - name: Download and normalize the Greene--Chen source page
        run: |
          python - <<'PY'
          import html, re, requests
          url = 'https://www.d.umn.edu/~jgreene/baillie/Baillie-PSW.html'
          r = requests.get(url, timeout=120, headers={'User-Agent':'mathematical-research/1.0'})
          r.raise_for_status()
          text = re.sub(r'<[^>]*>', ' ', r.text)
          text = html.unescape(text).replace('\xa0', ' ')
          open('enhanced-bpsw/greene-page.html','w',encoding='utf-8').write(text)
          print('normalized characters:', len(text))
          print('P markers:', len(re.findall(r'P\s*=\s*\{', text, flags=re.I)))
          PY
      - name: Accept the page's actual 4816-entry list
        run: |
          python - <<'PY'
          path='enhanced-bpsw/explore_greene.py'
          text=open(path,encoding='utf-8').read()
          text=text.replace('if len(pool) != 4838:', 'if len(pool) < 4800:')
          open(path,'w',encoding='utf-8').write(text)
          PY
      - name: Compute exact local orders and density frontiers
        run: |
          set -o pipefail
          python enhanced-bpsw/explore_greene.py \
            --output enhanced-bpsw/exploration.json \
            --records enhanced-bpsw/greene-records.jsonl \
            2>&1 | tee enhanced-bpsw/exploration.log
      - name: Upload exact-order exploration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-bpsw-exploration
          path: |
            enhanced-bpsw/exploration.json
            enhanced-bpsw/greene-records.jsonl
            enhanced-bpsw/exploration.log
            enhanced-bpsw/greene-page.html
          retention-days: 14
