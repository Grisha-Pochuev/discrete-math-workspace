name: Storage Maintenance

on:
  workflow_dispatch:
  public:

permissions:
  contents: read
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prune proven redundant Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_run_id = int(os.environ['GH_CURRENT_RUN_ID'])
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'storage-maintenance',
          }

          def api(method, path):
              url = path if path.startswith('http') else base + path
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      return None if not raw else json.loads(raw.decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')
                  raise RuntimeError(f'{method} {url} -> HTTP {e.code}: {body[:1000]}')

          def paged(path, key):
              out = []
              page = 1
              sep = '&' if '?' in path else '?'
              while True:
                  obj = api('GET', f'{path}{sep}per_page=100&page={page}')
                  batch = obj.get(key, [])
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          def mib(n):
              return n / (1024 ** 2)

          active_ids = {current_run_id}
          for status in ('queued', 'in_progress', 'waiting', 'requested', 'pending'):
              runs = paged(f'/actions/runs?status={status}', 'workflow_runs')
              active_ids.update(int(r['id']) for r in runs)

          artifacts = paged('/actions/artifacts', 'artifacts')
          live = [a for a in artifacts if not a.get('expired', False)]
          total_bytes = sum(int(a.get('size_in_bytes', 0)) for a in live)

          final_marker = re.compile(r'(collection|collector|consolidated|aggregate|archive|combined|final)', re.I)
          shard_marker = re.compile(r'(^|[-_])(data|shard|worker|job|part|chunk|checkpoint)([-_]|$|\d)', re.I)
          protected_marker = re.compile(r'(manifest|certificate|candidate|handoff|report|summary|collection|collector|consolidated|aggregate|archive|combined|final)', re.I)

          delete = {}

          # 1) Exact byte-for-byte duplicates: preserve one copy, regardless of age.
          by_digest = collections.defaultdict(list)
          for a in live:
              rid = int((a.get('workflow_run') or {}).get('id') or 0)
              if a.get('digest') and rid not in active_ids:
                  by_digest[a['digest']].append(a)

          def keep_score(a):
              name = a.get('name', '')
              return (
                  100 * bool(final_marker.search(name))
                  + 30 * (not bool(shard_marker.search(name)))
                  + 10 * (not bool(re.search(r'smoke|diagnostic|debug', name, re.I)))
              )

          for digest, group in by_digest.items():
              if len(group) < 2:
                  continue
              keep = max(group, key=lambda a: (keep_score(a), int(a.get('size_in_bytes', 0))))
              for a in group:
                  if int(a['id']) != int(keep['id']):
                      delete[int(a['id'])] = f'exact duplicate of artifact {keep["id"]}'

          # 2) Per-worker/shard artifacts only when the same successful run contains
          # a substantial consolidated/collection/archive artifact.
          by_run = collections.defaultdict(list)
          for a in live:
              rid = int((a.get('workflow_run') or {}).get('id') or 0)
              if rid:
                  by_run[rid].append(a)

          run_cache = {}
          def run_info(rid):
              if rid not in run_cache:
                  run_cache[rid] = api('GET', f'/actions/runs/{rid}')
              return run_cache[rid]

          for rid, group in by_run.items():
              if rid in active_ids:
                  continue
              finals = [a for a in group if final_marker.search(a.get('name',''))]
              shards = [a for a in group if shard_marker.search(a.get('name','')) and not protected_marker.search(a.get('name',''))]
              if not finals or not shards:
                  continue
              info = run_info(rid)
              if info.get('status') != 'completed' or info.get('conclusion') != 'success':
                  continue
              final = max(finals, key=lambda a: int(a.get('size_in_bytes', 0)))
              final_size = int(final.get('size_in_bytes', 0))
              shard_total = sum(int(a.get('size_in_bytes', 0)) for a in shards)
              shard_max = max(int(a.get('size_in_bytes', 0)) for a in shards)
              if final_size < shard_max or final_size < max(1024, int(0.10 * shard_total)):
                  continue
              for a in shards:
                  delete.setdefault(int(a['id']), f'shard represented by consolidated artifact {final["id"]}')

          delete_bytes = sum(int(a.get('size_in_bytes', 0)) for a in live if int(a['id']) in delete)
          if len(delete) > 900 or (total_bytes and delete_bytes > 0.80 * total_bytes):
              raise RuntimeError(f'Safety guard: refusing to delete {len(delete)} artifacts / {mib(delete_bytes):.1f} MiB')

          duplicate_count = sum(r.startswith('exact duplicate') for r in delete.values())
          shard_count = sum(r.startswith('shard represented') for r in delete.values())
          print(f'Artifacts before: {len(live)} live, {mib(total_bytes):.1f} MiB')
          print(f'Plan: {len(delete)} artifacts / {mib(delete_bytes):.1f} MiB')
          print(f'  exact-digest duplicates: {duplicate_count}')
          print(f'  consolidated-run shards: {shard_count}')

          id_to_art = {int(a['id']): a for a in live}
          reclaimed = 0
          deleted = 0
          for aid in sorted(delete):
              a = id_to_art[aid]
              api('DELETE', f'/actions/artifacts/{aid}')
              reclaimed += int(a.get('size_in_bytes', 0))
              deleted += 1
              if deleted % 50 == 0:
                  print(f'  deleted {deleted}/{len(delete)}...')

          remaining = [a for a in paged('/actions/artifacts', 'artifacts') if not a.get('expired', False)]
          remaining_bytes = sum(int(a.get('size_in_bytes', 0)) for a in remaining)
          print('--- FINAL REPORT ---')
          print(f'Deleted: {deleted} artifacts, reclaimed {mib(reclaimed):.1f} MiB')
          print(f'Remaining: {len(remaining)} artifacts, {mib(remaining_bytes):.1f} MiB')
          PY
