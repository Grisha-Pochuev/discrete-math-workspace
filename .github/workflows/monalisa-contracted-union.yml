name: Mona Lisa exact contracted-union search

on:
  push:
    branches:
      - monalisa-tsp-search-2026-09-03
    paths:
      - 'monalisa-tsp-search/contracted_union_search.py'
      - '.github/workflows/monalisa-contracted-union.yml'

permissions:
  contents: read

jobs:
  contracted-circuit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sanity-at-record
            upper_bound: 5757191
            seconds: 240
            seed: 103
          - name: seek-record-minus-one-a
            upper_bound: 5757190
            seconds: 1000
            seed: 260903
          - name: seek-record-minus-one-b
            upper_bound: 5757190
            seconds: 1000
            seed: 731927

    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact integer solver
        run: python -m pip install --disable-pip-version-check 'ortools==9.14.6206'

      - name: Download instance and nine historical tours
        shell: bash
        run: |
          set -euo pipefail
          data='monalisa-tsp-search/contracted-data'
          out='monalisa-tsp-search/contracted-output/${{ matrix.name }}'
          mkdir -p "$data" "$out"
          base='https://raw.githubusercontent.com/Hermann-SW/RR/main/data/tsp/extra'
          files=(
            mona-lisa100K.tsp
            mona-lisa100K.opt.tour
            monalisa_5757199.tour
            monalisa_5757200.tour
            monalisa_5757203.tour
            monalisa_5757204.tour
            monalisa_5757205.tour
            monalisa_5757241.tour
            monalisa_5757245.tour
            monalisa_5758831.tour
          )
          for f in "${files[@]}"; do
            curl --fail --location --retry 5 --retry-all-errors \
              "$base/$f" -o "$data/$f"
          done
          sha256sum "$data"/* | tee "$out/input-sha256.txt"

      - name: Solve the contracted Hamiltonian model
        shell: bash
        run: |
          set -euo pipefail
          data='monalisa-tsp-search/contracted-data'
          out='monalisa-tsp-search/contracted-output/${{ matrix.name }}'
          python monalisa-tsp-search/contracted_union_search.py \
            --instance "$data/mona-lisa100K.tsp" \
            --tours "$data/mona-lisa100K.opt.tour" "$data"/monalisa_*.tour \
            --output "$out" \
            --seconds '${{ matrix.seconds }}' \
            --workers 4 \
            --upper-bound '${{ matrix.upper_bound }}' \
            --seed '${{ matrix.seed }}' \
            2>&1 | tee "$out/solver.log"

      - name: Display result
        if: always()
        shell: bash
        run: |
          out='monalisa-tsp-search/contracted-output/${{ matrix.name }}'
          test -f "$out/contracted-union-result.json" \
            && cat "$out/contracted-union-result.json" || true

      - name: Upload exact-search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monalisa-contracted-${{ matrix.name }}
          path: monalisa-tsp-search/contracted-output/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 30
