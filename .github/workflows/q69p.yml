name: q69p
on:
  push:
    branches: [monalisa-tsp-search-2026-09-03]
    paths: ['.github/workflows/q69p.yml']
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: p
        env:
          PACKAGE_KEY: ${{ secrets.RKEY_02 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PACKAGE_KEY" ]; then
            printf 'package-key-present\n'
          else
            printf 'package-key-absent\n'
          fi
          nproc
