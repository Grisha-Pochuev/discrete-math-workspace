name: p05
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p05
  cancel-in-progress: false
jobs:
  r:
    name: r-${{ matrix.i }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - i: 0
            b: 0
            s: 424531338
          - i: 1
            b: 0
            s: 2041445633
          - i: 2
            b: 1
            s: 738855088
          - i: 3
            b: 1
            s: 1477264185
          - i: 4
            b: 2
            s: 298378116
          - i: 5
            b: 2
            s: 1751099627
          - i: 6
            b: 3
            s: 1803507374
          - i: 7
            b: 3
            s: 1900724245
          - i: 8
            b: 4
            s: 1318873706
          - i: 9
            b: 4
            s: 1188141901
          - i: 10
            b: 5
            s: 856865432
          - i: 11
            b: 5
            s: 1037760735
          - i: 12
            b: 6
            s: 2072076946
          - i: 13
            b: 6
            s: 274543503
          - i: 14
            b: 7
            s: 1044520908
          - i: 15
            b: 7
            s: 1574999787
          - i: 16
            b: 8
            s: 1513522992
          - i: 17
            b: 8
            s: 315387471
          - i: 18
            b: 9
            s: 1572639104
          - i: 19
            b: 9
            s: 406131237
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            r84/p01
            r84/p05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: limits
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOB_NAME: r-${{ matrix.i }}
        run: |
          set -euo pipefail
          mkdir -p o
          : > o/runs.jsonl
          for state in in_progress queued waiting requested pending; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$state&per_page=100" --jq '.workflow_runs[] | {id,status}' >> o/runs.jsonl
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > o/head-runs.json
          python - <<'PY'
          import json,os,datetime
          if os.environ['GITHUB_RUN_ATTEMPT']!='1': raise SystemExit('one attempt only')
          history=json.load(open('o/head-runs.json'))
          if history['total_count']>100: raise SystemExit('run history truncated')
          prior=[r for r in history['workflow_runs'] if r['path']=='.github/workflows/p05.yml' and r['id']!=int(os.environ['GITHUB_RUN_ID'])]
          if prior: raise SystemExit('one dispatch per head only')
          rows=[json.loads(x) for x in open('o/runs.jsonl')]
          busy=[r for r in rows if r['id']!=int(os.environ['GITHUB_RUN_ID']) and r['status'] in ('in_progress','queued','waiting','requested','pending')]
          if busy: raise SystemExit('other work is active')
          """Bounded read-only timing observation."""
          import datetime
          import json
          import os
          import pathlib
          import subprocess
          import time
          
          
          def inspect(payload, name, run_id, attempt, head, now):
              jobs = payload['jobs']
              if payload['total_count'] != len(jobs):
                  raise ValueError('jobs inventory truncated')
              matches = [j for j in jobs if j['name'] == name]
              if len(matches) > 1:
                  raise ValueError('ambiguous job identity')
              if not matches:
                  return None
              j = matches[0]
              if (j['run_id'], j['run_attempt'], j['head_sha']) != (run_id, attempt, head):
                  raise ValueError('job binding mismatch')
              if j['status'] == 'queued':
                  return None
              if j['status'] != 'in_progress':
                  raise ValueError('self job is terminal or unexpected')
              if j['started_at'] is None:
                  return None
              start = datetime.datetime.fromisoformat(j['started_at'].replace('Z', '+00:00'))
              if start.tzinfo is None or start.timestamp() > now + 5:
                  raise ValueError('invalid actual start')
              deadline = start.timestamp() + 350 * 60 - 60
              if deadline - now < 18000 + 1800:
                  raise ValueError('insufficient remaining job budget')
              return deadline
          
          
          def main():
              if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
                  raise SystemExit('one attempt only')
              until = time.monotonic() + 90
              endpoint = ('repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/'
                          + os.environ['GITHUB_RUN_ID'] + '/attempts/1/jobs?per_page=100')
              index = 0
              while True:
                  remaining = until - time.monotonic()
                  if remaining <= 0:
                      raise SystemExit('job timing unavailable after bounded observation')
                  response = subprocess.run(['gh', 'api', endpoint], check=True,
                                            capture_output=True, timeout=min(20, remaining))
                  pathlib.Path(f'o/jobs-observation-{index}.json').write_bytes(response.stdout)
                  payload = json.loads(response.stdout)
                  deadline = inspect(payload, os.environ['EXPECTED_JOB_NAME'],
                                     int(os.environ['GITHUB_RUN_ID']), 1,
                                     os.environ['GITHUB_SHA'], time.time())
                  if deadline is not None:
                      with open(os.environ['GITHUB_ENV'], 'a') as stream:
                          stream.write(f'JOB_DEADLINE={deadline}\n')
                      return
                  index += 1
                  time.sleep(max(0, min(3, until - time.monotonic())))
          
          
          if __name__ == '__main__':
              main()
          PY
      - name: prepare
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python r84/p05/r.py --bundle-index "${{ matrix.b }}" --output "$PWD/wd"
          sudo -n --preserve-env "$(command -v python)" wd/s/engine/vendor/smoke_memory_guard_checked.py > o/g-check.log 2>&1
      - name: compute
        env:
          T: '9000'
          S: ${{ matrix.s }}
          A: '1,2'
        run: |
          set -euo pipefail
          sudo -n --preserve-env "$(command -v python)" wd/s/engine/vendor/memory_guard.py --output "$PWD/o/guard" -- \
            "$(command -v python)" wd/s/run_experiment.py --bundle "$PWD/wd/b" --build "$PWD/wd/k" \
            --output "$PWD/o/run" --seconds "$T" --seed "$S" --operators "$A" --maxab 6000 --job-deadline "$JOB_DEADLINE" > o/run.log 2>&1
      - name: collect
        if: always()
        run: |
          mkdir -p o
          tar -cJf result.bin o
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p05-${{ github.run_id }}-${{ matrix.i }}
          path: result.bin
          retention-days: 14
          if-no-files-found: error
