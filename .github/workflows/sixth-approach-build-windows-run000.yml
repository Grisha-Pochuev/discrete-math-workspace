name: Sixth approach run-000 Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Compile optimized Windows worker
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /O2 /EHsc /DNDEBUG /Fe:sixth-run000-worker.exe "sixth approach\run000_worker.cpp"

      - name: Verify deterministic catalogue
        shell: pwsh
        run: |
          .\sixth-run000-worker.exe self-test | Tee-Object -FilePath self-test.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve portable worker
        uses: actions/upload-artifact@v4
        with:
          name: sixth-run000-windows-${{ github.run_id }}
          path: |
            sixth-run000-worker.exe
            self-test.json
          if-no-files-found: error
          retention-days: 14

