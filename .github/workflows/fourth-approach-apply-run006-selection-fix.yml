name: Apply Fourth approach Run 006 selection fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fourth-approach-apply-run006-selection-fix.yml'

permissions:
  contents: write

concurrency:
  group: fourth-approach-apply-run006-selection-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Blobless sparse clone
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=50 --filter=blob:none origin main
          git sparse-checkout init --cone
          git sparse-checkout set fourth-approach
          git checkout -B main FETCH_HEAD
      - name: Patch selector to accept full Run-005 gzip records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('fourth-approach/targeted_survivors.py')
          text=path.read_text(encoding='utf-8')
          old='''    hard = json.loads(hard_survivors.read_text(encoding="utf-8"))\n    survivors = list(hard.get("survivors", []))\n'''
          new='''    if hard_survivors.suffix == ".gz":\n        hard = read_gzip_json(hard_survivors)\n    else:\n        hard = json.loads(hard_survivors.read_text(encoding="utf-8"))\n    survivors = list(hard.get("records", hard.get("survivors", [])))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one selector block, found {text.count(old)}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          spec_path=Path('fourth-approach/run-specs/run-006-stage6-targeted-hard-survivors.json')
          import json
          spec=json.loads(spec_path.read_text(encoding='utf-8'))
          spec['sources']['run_005_full_bridge_records']='fourth-approach/runs/run-005-31034878944/bridge-records.json.gz'
          spec['sources'].pop('run_005_hard_survivors',None)
          spec['selection']['source_policy']='select from all 1300 Run-005 hard survivors; hard-survivors.json is only a compact 200-row display'
          spec_path.write_text(json.dumps(spec,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          python -m py_compile fourth-approach/targeted_survivors.py fourth-approach/run006_collect.py
      - name: Commit verified fix
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fourth-approach/targeted_survivors.py fourth-approach/run-specs/run-006-stage6-targeted-hard-survivors.json
          git commit -m 'fix Run 006 selection to use full Run 005 bridge records'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            git -c protocol.version=2 fetch --no-tags --depth=50 --filter=blob:none origin main
            git rebase origin/main
          done
