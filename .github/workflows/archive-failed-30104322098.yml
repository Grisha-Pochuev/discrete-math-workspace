name: archive verified partial batch 30104322098

on:
  push:
    branches: [main]
    paths:
      - ".archive-failed/30104322098.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-failed-30104322098
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: "30104322098"
      SOURCE_SHA: "0c238c4bf4070cfb13d80deeab67f5ed11289fca"
      SOURCE_TASKS: "runs/2026-07-24-b/next_tasks.json.gz"
      OUTPUT_DIR: "runs/2026-07-25-a"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact verification dependencies
        run: python -m pip install -r requirements.txt

      - name: Download and verify all original artifact ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/raw
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > work/artifacts.json
          python - <<'PY' > work/artifacts.tsv
          import json
          data = json.load(open('work/artifacts.json', encoding='utf-8'))
          artifacts = [
              artifact for artifact in data.get('artifacts', [])
              if artifact['name'].startswith('data-') and not artifact['expired']
          ]
          artifacts.sort(key=lambda artifact: int(artifact['name'].split('-')[1]))
          expected = [f'data-{index}' for index in range(20)]
          assert [artifact['name'] for artifact in artifacts] == expected
          for artifact in artifacts:
              print(f"{artifact['id']}\t{artifact['name']}\t{artifact.get('digest', '')}")
          PY
          while IFS=$'\t' read -r artifact_id artifact_name artifact_digest; do
            curl --fail --location --retry 4 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "work/raw/${artifact_name}.zip"
            unzip -t "work/raw/${artifact_name}.zip" >/dev/null
          done < work/artifacts.tsv
          test "$(find work/raw -maxdepth 1 -name 'data-*.zip' | wc -l)" -eq 20

      - name: Aggregate, compact, and verify exact partial result
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$OUTPUT_DIR"
          gzip -cd -- "$SOURCE_TASKS" > work/source_tasks.json
          python collect_run.py \
            --run-id "$RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-tasks work/source_tasks.json \
            --source-lane frontier3 \
            --manifest-stage frontier2 \
            --raw-dir work/raw \
            --output "$OUTPUT_DIR" \
            --reserve-limit 35 \
            --reserve-shards 131072 \
            --reserve-split 21 \
            | tee work/collection.log
          python compact_archive.py "$OUTPUT_DIR" | tee work/compaction.log
          python "$OUTPUT_DIR/verify.py" | tee work/verifier.log
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('runs/2026-07-25-a/summary.json').read_text(encoding='utf-8'))
          tasks = summary['tasks']
          nxt = summary['next_frontier']
          assert summary['run_id'] == 30104322098
          assert summary['source_tasks'] == 1034753
          assert tasks['recorded'] == 30061
          assert tasks['complete'] == 26756
          assert tasks['bounded_incomplete'] == 1273
          assert tasks['technical_failures'] == 2032
          assert tasks['unstarted'] == 1004692
          assert tasks['status_counts'] == {
              'capacity': 1213,
              'complete': 26756,
              'missing': 2032,
              'stopped': 1,
              'timeout': 59,
          }
          assert nxt['refined'] == 20368
          assert nxt['retry_carried'] == 2032
          assert nxt['unstarted_carried'] == 1004692
          assert nxt['reserve'] == 1048576
          assert nxt['tasks'] == 2075668
          assert nxt['by_limit'] == {
              '27': 2032,
              '30': 42020,
              '31': 65536,
              '32': 131072,
              '33': 262144,
              '34': 524288,
              '35': 1048576,
          }
          unsafe = [
              (path.stat().st_size, path.as_posix())
              for path in Path('runs/2026-07-25-a').rglob('*')
              if path.is_file() and path.stat().st_size >= 95 * 1024 * 1024
          ]
          assert not unsafe, unsafe
          print('PASS: exact partial archive and successor frontier verified')
          PY

      - name: Preserve verified archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-batch-archive-30104322098
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Publish isolated archive branch
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/archive-30104322098"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "archive branch already exists: $branch" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -f -- "$OUTPUT_DIR"
          git diff --cached --check
          git diff --cached --stat
          git commit -m "prepare batch run 30104322098 archive"
          git push origin "HEAD:$branch"
          printf 'branch=%s\ncommit=%s\n' "$branch" "$(git rev-parse HEAD)" | tee work/archive-branch.env

      - name: Upload archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-diagnostics-30104322098-${{ github.run_id }}
          path: |
            work/artifacts.tsv
            work/collection.log
            work/compaction.log
            work/verifier.log
            work/archive-branch.env
          if-no-files-found: warn
          retention-days: 7
