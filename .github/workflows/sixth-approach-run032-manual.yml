name: Sixth Approach Run 032 Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enumerate-layer:
    name: layer-${{ matrix.support }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        support: [56, 57, 58, 59, 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MALLOC_ARENA_MAX: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install compiled solver wheel
        run: python -m pip install --disable-pip-version-check --no-cache-dir ortools==9.15.6755

      - name: Record machine diagnostics
        shell: bash
        run: |
          mkdir -p out
          {
            date -u +%FT%TZ
            uname -a
            nproc
            lscpu
            free -h
            swapon --show
            df -h .
            ulimit -a
            python --version
            python -c 'import ortools; print(ortools.__version__)'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "support=${{ matrix.support }}"
          } > out/diagnostics.log

      - name: Start resource monitor
        shell: bash
        run: |
          (
            while true; do
              date -u +%FT%TZ
              grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
              ps -eo pid,ppid,rss,etime,cmd --sort=-rss | head -25
              sleep 30
            done
          ) > out/resource-monitor.log 2>&1 &
          echo $! > out/resource-monitor.pid

      - name: Run four exact shards
        id: compute
        shell: bash
        run: |
          set +e
          pids=()
          for shard in 0 1 2 3; do
            (
              ulimit -v $((2500*1024))
              timeout --signal=TERM --kill-after=30s 3300 \
                python 'sixth approach/run032_boundary_worker.py' \
                  --support '${{ matrix.support }}' \
                  --shard-id "$shard" \
                  --shard-count 4 \
                  --seconds 3240 \
                  --cap 2000000 \
                  --checkpoint-every 5000 \
                  --checkpoint-seconds 60 \
                  --output "out/shard-${shard}.json" \
                > "out/shard-${shard}.log" 2>&1
              echo $? > "out/shard-${shard}.exit"
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          exit 0

      - name: Stop monitor and validate exact coverage
        if: always()
        shell: bash
        run: |
          if [ -f out/resource-monitor.pid ]; then
            kill "$(cat out/resource-monitor.pid)" 2>/dev/null || true
          fi
          python 'sixth approach/run032_collect.py' \
            --support '${{ matrix.support }}' \
            --input-dir out \
            --require-exit-files \
            --output "out/layer-${{ matrix.support }}-merged.json"

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-032-layer-${{ matrix.support }}
          path: out/
          if-no-files-found: error
          retention-days: 7
