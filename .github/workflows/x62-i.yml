name: x62-i

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62-i.yml'

permissions:
  contents: read

jobs:
  t:
    strategy:
      fail-fast: false
      matrix:
        case: [a,b,c,d,e,f,g]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: t
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libboost-dev
          python3 - <<'PY'
          p='x62/c.cpp'; s=open(p).read()
          reps=[
          ('struct CNT { unsigned long long tri=0, s[10]{}, t[10]{}; };','struct CNT { unsigned long long tri=0, s[16]{}, t[16]{}; };'),
          ('if(K!=11 && K!=13) return 3;','if(K!=11 && K!=13 && K!=15) return 3;'),
          ('static bool crtState(const CTX& C,const ST* st,int ns,const U& B,U& x,U& M){','static bool first_feasible(const U& x,const U& M,const U& L,const U& B,U& y){ if(x>=L)y=x; else { if(M>B)return false; U d=L-x; y=x+((d+M-1)/M)*M; } return y<=B; }\n\nstatic bool crtState(const CTX& C,const ST* st,int ns,const U& B,U& x,U& M){'),
          ('    const vector<vector<U>>& below;\n    CNT& ct;','    const vector<vector<U>>& below;\n    const vector<U>& gmin;\n    CNT& ct;'),
          ('        if(rem<=4) return;\n        int lo=rem-1;\n        int q0=max(lo,(int)(lower_bound(mx[rem].begin()+lo,mx[rem].begin()+smallest,xH)-mx[rem].begin()));','        if(rem<=4) return;\n        U y0; if(!first_feasible(xH,MH,gmin[rem],mx[rem][smallest-1],y0)) return;\n        int lo=rem-1;\n        int q0=max(lo,(int)(lower_bound(mx[rem].begin()+lo,mx[rem].begin()+smallest,y0)-mx[rem].begin()));'),
          ('        for(int q=q0;q<smallest;q++){\n            if(!inherited_ok(xH,MH,C.P[q],below[rem-1][q])) continue;','        for(int q=q0;q<smallest;q++){\n            U iq; if(!first_feasible(xH,MH,U(C.P[q])*gmin[rem-1],mx[rem][q],iq)) continue;\n            if(!inherited_ok(xH,MH,C.P[q],below[rem-1][q])) continue;'),
          ('    vector<TASK> tasks;','    vector<U> gmin(K+1,1); for(int k=1;k<=K;k++) gmin[k]=gmin[k-1]*C.P[k-1];\n\n    vector<TASK> tasks;'),
          ('            int rem=K-3,lo=rem-1;\n            int v0=max(lo,(int)(lower_bound(mx[rem].begin()+lo,mx[rem].begin()+u,x3)-mx[rem].begin()));','            int rem=K-3,lo=rem-1;\n            U y3; if(!first_feasible(x3,M3,gmin[rem],B0,y3)) continue;\n            int v0=max(lo,(int)(lower_bound(mx[rem].begin()+lo,mx[rem].begin()+u,y3)-mx[rem].begin()));'),
          ('            for(int v=v0;v<u;v++){\n                if(!inherited_ok(x3,M3,C.P[v],below[rem-1][v])) continue;','            for(int v=v0;v<u;v++){\n                U iv; if(!first_feasible(x3,M3,U(C.P[v])*gmin[rem-1],mx[rem][v],iv)) continue;\n                if(!inherited_ok(x3,M3,C.P[v],below[rem-1][v])) continue;'),
          ('                Searcher S{C,K,mx,below,ct};','                Searcher S{C,K,mx,below,gmin,ct};'),
          ('        for(int h=3;h<10;h++){ Z.s[h]+=c.s[h]; Z.t[h]+=c.t[h]; }','        for(int h=3;h<16;h++){ Z.s[h]+=c.s[h]; Z.t[h]+=c.t[h]; }')]
          for a,b in reps:
              if a not in s: raise SystemExit('patch miss: '+a[:50])
              s=s.replace(a,b)
          open(p,'w').write(s)
          PY
          g++ -O3 -DNDEBUG -std=c++17 -fopenmp x62/c.cpp -o x62/x
          case='${{ matrix.case }}'
          case "$case" in
            a) args='200 4 0 20 11 0' ;;
            b) args='200 4 7 20 11 0' ;;
            c) args='60 4 0 1 13 1' ;;
            d) args='40 4 0 1 15 1' ;;
            e) args='50 4 0 1 15 1' ;;
            f) args='60 4 0 1 15 1' ;;
            g) args='80 4 0 1 15 1' ;;
          esac
          set +e
          timeout 20m ./x62/x x62/d $args >out 2>&1
          rc=$?
          set -e
          cat out
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: x62-i-${{ matrix.case }}
          path: out
          retention-days: 1
