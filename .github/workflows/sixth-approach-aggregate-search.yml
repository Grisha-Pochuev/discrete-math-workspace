name: Sixth Approach Aggregate Search
run-name: ${{ inputs.run_id }} aggregate search

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Neutral immutable run identifier
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: prepare-${{ inputs.run_id }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install immutable solver package
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'ortools==9.15.6755'
      - name: Verify immutable contract
        id: contract
        shell: bash
        env:
          CALC_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          test "$CALC_RUN_ID" = 'run-073'
          python -m py_compile \
            'sixth approach/run073_contract.py' \
            'sixth approach/run073_worker.py' \
            'sixth approach/run073_verify.py' \
            'sixth approach/run073_collect.py'
          matrix="$(python 'sixth approach/run073_contract.py' \
            --spec 'sixth approach/specs/run-073-search.json')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Run contract suites
        run: |
          python 'sixth approach/tests/test_run073_contract.py'
          python 'sixth approach/tests/test_run073_collector.py'
          python 'sixth approach/tests/test_run073_worker.py'

  search-group:
    name: group-${{ matrix.group }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install immutable solver package
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'ortools==9.15.6755'
      - name: Run two independent single-thread searches
        shell: bash
        env:
          CALC_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os
          from pathlib import Path
          spec = json.loads(Path('sixth approach/specs/run-073-search.json').read_text())
          group = int(os.environ['CALC_GROUP'])
          ids = [row['id'] for row in spec['searches'] if row['group'] == group]
          assert len(ids) == 2
          Path('out/searches.txt').write_text(''.join(x + '\n' for x in ids), encoding='ascii')
          PY
          {
            date -u +%FT%TZ
            uname -a
            nproc
            free -h
            df -h .
            python --version
            python -c "import ortools; print(ortools.__version__)"
            echo "GITHUB_SHA=$GITHUB_SHA"
            sha256sum \
              'sixth approach/specs/run-073-search.json' \
              'sixth approach/specs/run-073-types.json' \
              'sixth approach/specs/run-073-input.json' \
              'sixth approach/specs/run-073-input-acceptance.json' \
              'sixth approach/run073_worker.py' \
              'sixth approach/run073_verify.py'
          } > out/diagnostics.log
          pids=()
          while IFS= read -r search_id; do
            mkdir -p "out/$search_id"
            (
              set +e
              timeout --signal=TERM --kill-after=60s 11400s \
                python 'sixth approach/run073_worker.py' \
                  --spec 'sixth approach/specs/run-073-search.json' \
                  --search-id "$search_id" \
                  --output "out/$search_id/result.json" \
                > "out/$search_id/worker.log" 2>&1
              echo "$?" > "out/$search_id/worker.exit"
            ) &
            pids+=("$!")
          done < out/searches.txt
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Validate group outputs
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for search_id in Path('out/searches.txt').read_text().split():
              root = Path('out') / search_id
              assert root.joinpath('worker.exit').read_text().strip() == '0'
              result = json.loads(root.joinpath('result.json').read_text())
              assert result['schema'] == 'run-073-result-v1'
              assert result['search_id'] == search_id
              assert result['solver_status'] in {'OPTIMAL','FEASIBLE','INFEASIBLE','UNKNOWN'}
          PY
      - name: Upload compact group result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.run_id }}-g${{ matrix.group }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  collect:
    name: collect-${{ inputs.run_id }}
    needs: [prepare, search-group]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download group results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: ${{ inputs.run_id }}-g*
          path: work/results
      - name: Strictly replay and archive
        id: collector
        shell: bash
        run: |
          set +e
          archive="sixth approach/runs/${{ inputs.run_id }}-${GITHUB_RUN_ID}"
          python 'sixth approach/run073_collect.py' \
            --input-root work/results \
            --spec 'sixth approach/specs/run-073-search.json' \
            --output-dir "$archive" \
            --workflow-run "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA" > collector.log 2>&1
          code=$?
          echo "$code" > collector.exit
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit compact accepted archive
        if: steps.collector.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          archive="sixth approach/runs/${{ inputs.run_id }}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$archive"
          git commit -m "archive ${{ inputs.run_id }} from ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" != 4
            git -c protocol.version=2 fetch --no-tags --depth=50 --filter=blob:none origin main
            git rebase origin/main
          done
      - name: Upload collector diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.run_id }}-collection
          path: |
            collector.log
            collector.exit
            sixth approach/runs/${{ inputs.run_id }}-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 7
      - name: Require complete collection
        if: always()
        shell: bash
        run: exit "$(cat collector.exit 2>/dev/null || echo 2)"
