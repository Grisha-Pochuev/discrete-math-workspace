name: x62-a

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62-a.yml'

permissions:
  contents: read
  actions: read

jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: collect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 33170450447 -R Grisha-Pochuev/discrete-math-workspace -D z
          python3 - <<'PY' | tee audit.txt
          import glob,re,sys
          logs=sorted(glob.glob('z/x62-[0-9]*/l'))
          print('files',len(logs))
          if len(logs)!=160: raise SystemExit('bad file count')
          ids=[]; tops=[]; agg={}; secs=0.0; hit=[]
          for p in logs:
              m=re.search(r'x62-(\d+)/l$',p); sh=int(m.group(1))
              lines=open(p,encoding='utf-8').read().splitlines()
              ds=[int(x[2:]) for x in lines if x.startswith('D ')]
              exp=3236 if sh<53 else 3235
              if len(ds)!=exp: raise SystemExit(f'bad D count shard {sh}: {len(ds)} != {exp}')
              ids.extend(ds)
              tops += [(sh,x) for x in lines if x.startswith('TOP')]
              dl=[x for x in lines if x.startswith('DONE ')]
              if len(dl)!=1: raise SystemExit(f'bad DONE shard {sh}: {len(dl)}')
              vals={}
              for tok in dl[0].split()[1:]:
                  if '=' not in tok: continue
                  k,v=tok.split('=',1)
                  if k=='sec': secs += float(v)
                  else:
                      vals[k]=int(v); agg[k]=agg.get(k,0)+int(v)
              if vals.get('s7',0): hit.append((sh,vals.get('t7',0),vals.get('s7',0),vals.get('s6',0)))
          s=sorted(ids)
          if len(s)!=517653 or s!=list(range(517653)): raise SystemExit('bad coverage')
          print('coverage',len(s),len(set(s)),s[0],s[-1])
          print('done',len(logs))
          print('tops',len(tops))
          print('hitshards',hit)
          print('sumsec',round(secs,3))
          for k in ['triples','s3','t4','s4','t5','s5','t6','s6','t7','s7','t8','s8','t9','s9']:
              print(k,agg.get(k,0))
          if tops: raise SystemExit(4)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: x62-a
          path: audit.txt
          retention-days: 2
