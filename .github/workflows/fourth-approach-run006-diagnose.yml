name: Diagnose Fourth approach Run 006 selection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fourth-approach-run006-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: fourth-approach-run-006-diagnose
  cancel-in-progress: true

jobs:
  diagnose-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            '/fourth-approach/' \
            '/third-approach-2.0/certificate.py' \
            '/third-approach-2.0/requirements.txt'
          git checkout --detach FETCH_HEAD
          mkdir -p second-approach/candidates second-approach-2.0/candidates prepared
          git show "$GITHUB_SHA:second-approach/candidates/seed-bank.json.gz" > second-approach/candidates/seed-bank.json.gz
          git show "$GITHUB_SHA:second-approach-2.0/candidates/bank.json.gz" > second-approach-2.0/candidates/bank.json.gz
      - name: Install requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r third-approach-2.0/requirements.txt
      - name: Reproduce selection with visible log
        shell: bash
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python fourth-approach/targeted_survivors.py prepare \
            --repo . \
            --hard-survivors fourth-approach/runs/run-005-31034878944/hard-survivors.json \
            --old-bank second-approach/candidates/seed-bank.json.gz \
            --second20-bank second-approach-2.0/candidates/bank.json.gz \
            --output prepared/selected-survivors.json.gz \
            2>&1 | tee prepared/selection.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourth-approach-run006-selection-diagnostics
          path: prepared/
          if-no-files-found: warn
          retention-days: 7
