name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: x62-ae34
  cancel-in-progress: false

jobs:
  e:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: 2501, b: 0}
          - {id: 2509, b: 4}
          - {id: 2517, b: 8}
          - {id: 2525, b: 12}
          - {id: 2533, b: 16}
          - {id: 2541, b: 20}
          - {id: 2549, b: 24}
          - {id: 2557, b: 28}
          - {id: 2565, b: 32}
          - {id: 2573, b: 36}
          - {id: 2581, b: 40}
          - {id: 2589, b: 44}
          - {id: 2597, b: 48}
          - {id: 2605, b: 52}
          - {id: 2613, b: 56}
          - {id: 2621, b: 60}
          - {id: 2629, b: 64}
          - {id: 2637, b: 68}
          - {id: 2645, b: 72}
          - {id: 2653, b: 76}
    name: e-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: r
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p x62/a
          for k in 0 1 2 3 4 5 6 7; do
            gh run download 33535808668 -n "c-$k" -D "x62/a/z-$k"
          done
          python3 x62/t.py x62/d x62/z x62/f
          sed \
            -e 's/mod\[20\]=625;mod\[21\]=mod\[22\]=5;/mod[20]=625;mod[21]=mod[22]=1;/' \
            -e 's/o.c\[20\]=s0%625;o.c\[21\]=s1%5;o.c\[22\]=s2%5;/o.c[20]=s0%625;o.c[21]=0;o.c[22]=0;/' \
            -e 's/tar\[20\]=0;tar\[21\]=t5\[f1\]%5;tar\[22\]=t5\[f2\]%5;/tar[20]=0;tar[21]=0;tar[22]=0;/' \
            -e 's/if(lev\[f1\]<1||lev\[f2\]<1)abort();//' \
            x62/aa.cpp > x62/ae.cpp
          grep -q 'mod\[21\]=mod\[22\]=1;' x62/ae.cpp
          grep -q 'o.c\[21\]=0;o.c\[22\]=0;' x62/ae.cpp
          grep -q 'tar\[21\]=0;tar\[22\]=0;' x62/ae.cpp
          if grep -q 'if(lev\[f1\]<1||lev\[f2\]<1)abort();' x62/ae.cpp; then exit 9; fi
          g++ -O3 -march=native -std=c++20 x62/ae.cpp -o x62/ae
          set +e
          pids=""
          for j in 0 1 2 3; do
            sl=$(( ${{ matrix.b }} + j ))
            timeout 110m x62/ae x62/z x62/f "$sl" 80 "x62/out$j" x62/a/z-0/o x62/a/z-1/o x62/a/z-2/o x62/a/z-3/o x62/a/z-4/o x62/a/z-5/o x62/a/z-6/o x62/a/z-7/o >"x62/log$j" 2>&1 &
            pids="$pids $!"
          done
          for p in $pids; do wait "$p" || true; done
          set -e
          cat x62/out* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e-${{ matrix.id }}
          path: |
            x62/out*
            x62/log*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
