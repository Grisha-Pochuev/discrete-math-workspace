name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-main
  cancel-in-progress: false

jobs:
  i:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {s: 101,   k: 515, o: 0, m: 0, b: 24}
          - {s: 1009,  k: 515, o: 1, m: 1, b: 24}
          - {s: 10007, k: 515, o: 2, m: 2, b: 24}
          - {s: 20011, k: 515, o: 2, m: 0, b: 16}
          - {s: 30013, k: 513, o: 0, m: 1, b: 24}
          - {s: 40009, k: 517, o: 1, m: 2, b: 24}
    name: i-${{ matrix.s }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 27m python3 x62/i.py x62/d ${{ matrix.s }} 1560 x62/r ${{ matrix.k }} ${{ matrix.o }} ${{ matrix.m }} ${{ matrix.b }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/r || true
          if grep -q '^FOUND$' x62/r 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i-${{ matrix.s }}
          path: |
            x62/r
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
