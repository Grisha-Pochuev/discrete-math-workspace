name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-o27
  cancel-in-progress: false

jobs:
  o:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {id: 1201, s: 1201, d: 38, o: 0, m: 1, b: 3}
          - {id: 1209, s: 1209, d: 40, o: 4, m: 2, b: 2}
          - {id: 1217, s: 1217, d: 40, o: 1, m: 1, b: 3}
          - {id: 1225, s: 1225, d: 42, o: 2, m: 2, b: 4}
          - {id: 1233, s: 1233, d: 42, o: 0, m: 0, b: 3}
          - {id: 1241, s: 1241, d: 44, o: 4, m: 1, b: 2}
          - {id: 1249, s: 1249, d: 44, o: 1, m: 2, b: 4}
          - {id: 1257, s: 1257, d: 46, o: 3, m: 1, b: 3}
          - {id: 1265, s: 1265, d: 46, o: 2, m: 0, b: 4}
          - {id: 1273, s: 1273, d: 48, o: 4, m: 2, b: 3}
    name: o-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 44m python3 x62/o.py x62/d ${{ matrix.s }} 2520 x62/out ${{ matrix.d }} ${{ matrix.o }} ${{ matrix.m }} ${{ matrix.b }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/out || true
          if grep -q '^FOUND$' x62/out 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o-${{ matrix.id }}
          path: |
            x62/out
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
