name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-z22
  cancel-in-progress: false

jobs:
  g:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        b: [0, 1, 2, 3, 4, 5, 6, 7]
    name: z-${{ matrix.b }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: r
        shell: bash
        run: |
          python3 x62/t.py x62/d x62/z
          g++ -O3 -march=native -fopenmp -std=c++17 x62/u.cpp -o x62/u
          timeout 26m x62/u x62/z 424242 ${{ matrix.b }} 700 x62/o >x62/stdout 2>&1
          cat x62/stdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z-${{ matrix.b }}
          path: |
            x62/o
            x62/stdout
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  v:
    needs: g
    name: z-8
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: z-*
          path: x62/a
      - name: r
        shell: bash
        run: |
          python3 x62/t.py x62/d x62/z
          g++ -O3 -march=native -std=c++17 x62/w.cpp -o x62/w
          set +e
          timeout 16m x62/w x62/z 62031 24 x62/r x62/a/z-0/o x62/a/z-1/o x62/a/z-2/o x62/a/z-3/o x62/a/z-4/o x62/a/z-5/o x62/a/z-6/o x62/a/z-7/o >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/r || true
          if grep -q '^FOUND$' x62/r 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z-8
          path: |
            x62/r
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
