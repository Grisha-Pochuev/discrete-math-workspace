name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'x62/**'
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-main
  cancel-in-progress: false

jobs:
  prep:
    name: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: check
        shell: bash
        run: |
          set -euo pipefail
          test -s x62/b.py
          test -s x62/d
          test "$(wc -l < x62/d)" -eq 1029
          echo "fd7f67051b817842f5795fae812b852efa8007f5478a286365a7236a6a790cd8  x62/d" | sha256sum -c -
          python3 x62/b.py x62/d check

      - name: deps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x62/w
          for attempt in 1 2 3; do
            rm -f x62/w/*
            if python3 -m pip download --disable-pip-version-check --only-binary=:all: --dest x62/w ortools==9.15.6755; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::dependency download failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf x62/s
          python3 -m pip install --disable-pip-version-check --no-index --find-links x62/w --target x62/s ortools==9.15.6755
          PYTHONPATH="$PWD/x62/s" python3 -c 'import ortools; print(ortools.__version__)'
          PYTHONPATH="$PWD/x62/s" python3 x62/b.py x62/d check
          set +e
          PYTHONPATH="$PWD/x62/s" python3 x62/b.py x62/d 0 1 20 x62/t
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::smoke exited with code $rc"
            exit "$rc"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: x62-runtime
          path: |
            x62/b.py
            x62/d
            x62/w
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  r:
    needs: prep
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: 0,  k: 497, seed: 6202600}
          - {id: 1,  k: 499, seed: 6202601}
          - {id: 2,  k: 501, seed: 6202602}
          - {id: 3,  k: 503, seed: 6202603}
          - {id: 4,  k: 505, seed: 6202604}
          - {id: 5,  k: 507, seed: 6202605}
          - {id: 6,  k: 509, seed: 6202606}
          - {id: 7,  k: 511, seed: 6202607}
          - {id: 8,  k: 513, seed: 6202608}
          - {id: 9,  k: 515, seed: 6202609}
          - {id: 10, k: 517, seed: 6202610}
          - {id: 11, k: 519, seed: 6202611}
          - {id: 12, k: 521, seed: 6202612}
          - {id: 13, k: 523, seed: 6202613}
          - {id: 14, k: 525, seed: 6202614}
          - {id: 15, k: 527, seed: 6202615}
          - {id: 16, k: 529, seed: 6202616}
          - {id: 17, k: 531, seed: 6202617}
          - {id: 18, k: 533, seed: 6202618}
          - {id: 19, k: 535, seed: 6202619}

    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x62-runtime
          path: x62

      - name: run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf x62/s
          python3 -m pip install --disable-pip-version-check --no-index --find-links x62/w --target x62/s ortools==9.15.6755
          set +e
          PYTHONPATH="$PWD/x62/s" python3 x62/b.py x62/d ${{ matrix.k }} ${{ matrix.seed }} 19000 x62/z >x62/l 2>&1
          rc=$?
          set -e
          cat x62/l
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::x62 exited with code $rc"
            exit "$rc"
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x62-${{ matrix.id }}
          path: |
            x62/z
            x62/l
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
