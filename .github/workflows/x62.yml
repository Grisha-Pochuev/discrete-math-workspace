name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-l26
  cancel-in-progress: false

jobs:
  l:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {id: 1101, s: 1101, t: 20, o: 0, m: 1, b: 3}
          - {id: 1109, s: 1109, t: 20, o: 4, m: 2, b: 2}
          - {id: 1117, s: 1117, t: 21, o: 1, m: 1, b: 3}
          - {id: 1125, s: 1125, t: 21, o: 2, m: 2, b: 4}
          - {id: 1133, s: 1133, t: 22, o: 0, m: 0, b: 3}
          - {id: 1141, s: 1141, t: 22, o: 4, m: 1, b: 2}
          - {id: 1149, s: 1149, t: 23, o: 1, m: 2, b: 4}
          - {id: 1157, s: 1157, t: 23, o: 3, m: 1, b: 3}
          - {id: 1165, s: 1165, t: 24, o: 2, m: 0, b: 4}
          - {id: 1173, s: 1173, t: 24, o: 4, m: 2, b: 3}
    name: l-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 44m python3 x62/l.py x62/d ${{ matrix.s }} 2520 x62/out ${{ matrix.t }} ${{ matrix.o }} ${{ matrix.m }} ${{ matrix.b }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/out || true
          if grep -q '^FOUND$' x62/out 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l-${{ matrix.id }}
          path: |
            x62/out
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
