name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-q20
  cancel-in-progress: false

jobs:
  q:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {id: 701, s: 701, st: 0, m: 0, b: 18, g: 8}
          - {id: 709, s: 709, st: 0, m: 1, b: 24, g: 10}
          - {id: 717, s: 717, st: 1, m: 0, b: 18, g: 12}
          - {id: 725, s: 725, st: 1, m: 2, b: 28, g: 8}
          - {id: 733, s: 733, st: 2, m: 1, b: 24, g: 15}
          - {id: 741, s: 741, st: 3, m: 0, b: 20, g: 10}
          - {id: 749, s: 749, st: 3, m: 2, b: 30, g: 5}
          - {id: 757, s: 757, st: 4, m: 1, b: 20, g: 12}
          - {id: 765, s: 765, st: 4, m: 0, b: 30, g: 15}
          - {id: 773, s: 773, st: 2, m: 2, b: 16, g: 5}
    name: q-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 44m python3 x62/q.py x62/d ${{ matrix.s }} 2520 x62/r 515 ${{ matrix.st }} ${{ matrix.m }} ${{ matrix.b }} ${{ matrix.g }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/r || true
          if grep -q '^FOUND$' x62/r 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q-${{ matrix.id }}
          path: |
            x62/r
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
