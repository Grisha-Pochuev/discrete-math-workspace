name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-main
  cancel-in-progress: false

jobs:
  d:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        r: [37, 197, 357, 517, 677, 837, 997, 1157, 146, 306, 466, 626, 786, 946, 1106, 1266]
    name: d-${{ matrix.r }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libboost-dev

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < x62/d)" -eq 1029
          echo "fd7f67051b817842f5795fae812b852efa8007f5478a286365a7236a6a790cd8  x62/d" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('x62/c.cpp')
          s=p.read_text()
          old='''            ct.s[H+1]++;\n            top[H]=q;\n            if(rem-1==4){'''
          new='''            ct.s[H+1]++;\n            top[H]=q;\n            if(H+1==7){\n                int rem2=K-(H+1);\n                U L6=1; for(int z2=0;z2<rem2;z2++) L6*=C.P[z2];\n                U B6=below[rem2][q];\n                U f6=x;\n                if(f6<L6) f6=x+((L6-x+M-1)/M)*M;\n                int lo2=rem2-1;\n                int r0=max(lo2,(int)(lower_bound(mx[rem2].begin()+lo2,mx[rem2].begin()+q,x)-mx[rem2].begin()));\n#pragma omp critical(out)\n                {\n                    cerr<<"S7 I";\n                    for(int h=0;h<=H;h++) cerr<<" "<<top[h];\n                    cerr<<" P";\n                    for(int h=0;h<=H;h++) cerr<<" "<<C.P[top[h]];\n                    cerr<<" x="<<x<<" M="<<M<<" L6="<<L6<<" B6="<<B6<<" F6="<<f6<<" F6ok="<<(f6<=B6)<<" r0="<<r0<<" hi="<<(q-1)<<"\\n";\n                    U L5=1; for(int z2=0;z2<rem2-1;z2++) L5*=C.P[z2];\n                    for(int r=r0;r<q;r++){\n                        uint128_t qq=C.P[r];\n                        uint128_t mm=(M%qq).convert_to<uint128_t>();\n                        uint128_t iv=invmod128(mm,qq);\n                        uint128_t xm=(x%qq).convert_to<uint128_t>();\n                        uint128_t dd=xm ? qq-xm : 0;\n                        uint128_t kk=(uint256_t(dd)*iv%qq).convert_to<uint128_t>();\n                        U yy=(x+M*kk)/qq;\n                        U BB=below[rem2-1][r];\n                        U ff=yy;\n                        if(ff<L5) ff=yy+((L5-yy+M-1)/M)*M;\n                        cerr<<"N r="<<r<<" p="<<C.P[r]<<" y="<<yy<<" L5="<<L5<<" B5="<<BB<<" up="<<(yy<=BB)<<" F5="<<ff<<" int="<<(ff<=BB)<<"\\n";\n                    }\n                }\n            }\n            if(rem-1==4){'''
          if old not in s:
              raise SystemExit('patch target missing')
          p.with_name('e.cpp').write_text(s.replace(old,new,1))
          PY
          g++ -O3 -DNDEBUG -std=c++17 -fopenmp x62/e.cpp -o x62/e

      - name: run
        shell: bash
        run: |
          set +e
          timeout 85m ./x62/e x62/d 1029 4 ${{ matrix.r }} 1280 13 1 >x62/l 2>&1
          rc=$?
          set -e
          grep -E '^(S7|N |DONE)' x62/l || true
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-${{ matrix.r }}
          path: x62/l
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
