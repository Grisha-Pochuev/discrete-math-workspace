name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-y23
  cancel-in-progress: false

jobs:
  y:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {id: 801, s: 801, w: 0,   o: 0, m: 2, b: 4}
          - {id: 809, s: 809, w: 0,   o: 2, m: 4, b: 3}
          - {id: 817, s: 817, w: 0,   o: 3, m: 2, b: 2}
          - {id: 825, s: 825, w: 900, o: 0, m: 2, b: 4}
          - {id: 833, s: 833, w: 800, o: 1, m: 4, b: 3}
          - {id: 841, s: 841, w: 700, o: 2, m: 2, b: 4}
          - {id: 849, s: 849, w: 600, o: 0, m: 0, b: 3}
          - {id: 857, s: 857, w: 500, o: 4, m: 2, b: 2}
          - {id: 865, s: 865, w: 0,   o: 0, m: 3, b: 4}
          - {id: 873, s: 873, w: 800, o: 3, m: 5, b: 2}
    name: y-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 44m python3 x62/y.py x62/d ${{ matrix.s }} 2520 x62/r ${{ matrix.w }} ${{ matrix.o }} ${{ matrix.m }} ${{ matrix.b }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/r || true
          if grep -q '^FOUND$' x62/r 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-${{ matrix.id }}
          path: |
            x62/r
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
