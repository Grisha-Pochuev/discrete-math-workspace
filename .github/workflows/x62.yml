name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'x62/**'
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-main
  cancel-in-progress: false

jobs:
  prep:
    name: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: check
        shell: bash
        run: |
          set -euo pipefail
          test -s x62/b.py
          test -s x62/d
          test "$(wc -l < x62/d)" -eq 1029
          echo "fd7f67051b817842f5795fae812b852efa8007f5478a286365a7236a6a790cd8  x62/d" | sha256sum -c -
          python3 -m py_compile x62/b.py
          python3 x62/b.py x62/d check

      - name: deps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x62/w
          for attempt in 1 2 3; do
            rm -f x62/w/*
            if python3 -m pip download --disable-pip-version-check --only-binary=:all: --dest x62/w ortools==9.15.6755; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf x62/s
          python3 -m pip install --disable-pip-version-check --no-index --find-links x62/w --target x62/s ortools==9.15.6755
          PYTHONPATH="$PWD/x62/s" python3 -c 'import ortools; print(ortools.__version__)'
          set +e
          PYTHONPATH="$PWD/x62/s:$PWD/x62" python3 x62/b.py x62/d 6207999 8 x62/t s 0 0
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: x62-runtime
          path: |
            x62/b.py
            x62/d
            x62/w
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  r:
    needs: prep
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: 0,  seed: 6207100, form: s, mode: 0, fix: 0}
          - {id: 1,  seed: 6207101, form: s, mode: 0, fix: 8}
          - {id: 2,  seed: 6207102, form: s, mode: 0, fix: 12}
          - {id: 3,  seed: 6207103, form: s, mode: 0, fix: 16}
          - {id: 4,  seed: 6207104, form: s, mode: 3, fix: 0}
          - {id: 5,  seed: 6207105, form: s, mode: 3, fix: 8}
          - {id: 6,  seed: 6207106, form: s, mode: 3, fix: 12}
          - {id: 7,  seed: 6207107, form: s, mode: 3, fix: 16}
          - {id: 8,  seed: 6207108, form: s, mode: 1, fix: 12}
          - {id: 9,  seed: 6207109, form: s, mode: 2, fix: 12}
          - {id: 10, seed: 6207110, form: c, mode: 0, fix: 0}
          - {id: 11, seed: 6207111, form: c, mode: 0, fix: 8}
          - {id: 12, seed: 6207112, form: c, mode: 0, fix: 12}
          - {id: 13, seed: 6207113, form: c, mode: 0, fix: 16}
          - {id: 14, seed: 6207114, form: c, mode: 3, fix: 0}
          - {id: 15, seed: 6207115, form: c, mode: 3, fix: 8}
          - {id: 16, seed: 6207116, form: c, mode: 3, fix: 12}
          - {id: 17, seed: 6207117, form: c, mode: 3, fix: 16}
          - {id: 18, seed: 6207118, form: c, mode: 1, fix: 12}
          - {id: 19, seed: 6207119, form: c, mode: 2, fix: 12}

    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x62-runtime
          path: x62

      - name: run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf x62/s
          python3 -m pip install --disable-pip-version-check --no-index --find-links x62/w --target x62/s ortools==9.15.6755
          set +e
          PYTHONPATH="$PWD/x62/s:$PWD/x62" python3 x62/b.py x62/d ${{ matrix.seed }} 180 x62/z ${{ matrix.form }} ${{ matrix.mode }} ${{ matrix.fix }} >x62/l 2>&1
          rc=$?
          set -e
          cat x62/l
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x62-${{ matrix.id }}
          path: |
            x62/z
            x62/l
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
