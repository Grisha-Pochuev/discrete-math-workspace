name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-r25
  cancel-in-progress: false

jobs:
  r:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {id: 1001, s: 1001, t: 20, o: 0, m: 1, b: 4, f: 0}
          - {id: 1009, s: 1009, t: 21, o: 1, m: 2, b: 4, f: 0}
          - {id: 1017, s: 1017, t: 22, o: 2, m: 1, b: 5, f: 0}
          - {id: 1025, s: 1025, t: 23, o: 3, m: 2, b: 5, f: 0}
          - {id: 1033, s: 1033, t: 24, o: 0, m: 0, b: 7, f: 0}
          - {id: 1041, s: 1041, t: 20, o: 2, m: 1, b: 4, f: 1}
          - {id: 1049, s: 1049, t: 21, o: 0, m: 2, b: 5, f: 1}
          - {id: 1057, s: 1057, t: 22, o: 3, m: 1, b: 5, f: 1}
          - {id: 1065, s: 1065, t: 23, o: 1, m: 0, b: 7, f: 1}
          - {id: 1073, s: 1073, t: 24, o: 2, m: 2, b: 7, f: 1}
    name: r-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 44m python3 x62/r.py x62/d ${{ matrix.s }} 2520 x62/out ${{ matrix.t }} ${{ matrix.o }} ${{ matrix.m }} ${{ matrix.b }} ${{ matrix.f }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/out || true
          if grep -q '^FOUND$' x62/out 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-${{ matrix.id }}
          path: |
            x62/out
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
