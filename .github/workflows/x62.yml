name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: x62-aa31
  cancel-in-progress: false

jobs:
  a:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: 1901, b: 0}
          - {id: 1909, b: 4}
          - {id: 1917, b: 8}
          - {id: 1925, b: 12}
          - {id: 1933, b: 16}
          - {id: 1941, b: 20}
          - {id: 1949, b: 24}
          - {id: 1957, b: 28}
          - {id: 1965, b: 32}
          - {id: 1973, b: 36}
          - {id: 1981, b: 40}
          - {id: 1989, b: 44}
          - {id: 1997, b: 48}
          - {id: 2005, b: 52}
          - {id: 2013, b: 56}
          - {id: 2021, b: 60}
          - {id: 2029, b: 64}
          - {id: 2037, b: 68}
          - {id: 2045, b: 72}
          - {id: 2053, b: 76}
    name: a-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: r
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p x62/a
          for b in 0 1 2 3 4 5 6 7; do
            gh run download 33345107048 -n "z-$b" -D "x62/a/z-$b"
          done
          python3 x62/t.py x62/d x62/z x62/f
          g++ -O3 -march=native -std=c++20 x62/aa.cpp -o x62/aa
          set +e
          pids=""
          for j in 0 1 2 3; do
            sl=$(( ${{ matrix.b }} + j ))
            timeout 110m x62/aa x62/z x62/f "$sl" 80 "x62/out$j" x62/a/z-0/o x62/a/z-1/o x62/a/z-2/o x62/a/z-3/o x62/a/z-4/o x62/a/z-5/o x62/a/z-6/o x62/a/z-7/o >"x62/log$j" 2>&1 &
            pids="$pids $!"
          done
          for p in $pids; do wait "$p" || true; done
          set -e
          cat x62/out* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-${{ matrix.id }}
          path: |
            x62/out*
            x62/log*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
