name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'x62/**'
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-main
  cancel-in-progress: false

jobs:
  build:
    name: build-and-smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: install-boost
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libboost-dev; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::failed to install libboost-dev after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          test -s x62/a.cpp
          test -s x62/d
          test "$(wc -l < x62/d)" -ge 1029
          g++ -O3 -DNDEBUG -std=c++17 -fopenmp x62/a.cpp -o x62/x
          test -x x62/x

      - name: smoke-test
        shell: bash
        run: |
          set +e
          timeout 120s ./x62/x x62/d 20 1 6 6
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::smoke test exited with code $rc"
            exit "$rc"
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: x62-runtime
          path: |
            x62/x
            x62/d
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  r:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: 0, lo: 6, hi: 23}
          - {id: 1, lo: 24, hi: 41}
          - {id: 2, lo: 42, hi: 60}
          - {id: 3, lo: 61, hi: 80}
          - {id: 4, lo: 81, hi: 101}
          - {id: 5, lo: 102, hi: 123}
          - {id: 6, lo: 124, hi: 146}
          - {id: 7, lo: 147, hi: 170}
          - {id: 8, lo: 171, hi: 195}
          - {id: 9, lo: 196, hi: 222}
          - {id: 10, lo: 223, hi: 251}
          - {id: 11, lo: 252, hi: 282}
          - {id: 12, lo: 283, hi: 316}
          - {id: 13, lo: 317, hi: 354}
          - {id: 14, lo: 355, hi: 396}
          - {id: 15, lo: 397, hi: 445}
          - {id: 16, lo: 446, hi: 504}
          - {id: 17, lo: 505, hi: 580}
          - {id: 18, lo: 581, hi: 697}
          - {id: 19, lo: 698, hi: 1026}

    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x62-runtime
          path: x62

      - name: run
        shell: bash
        run: |
          chmod +x x62/x
          set +e
          ./x62/x x62/d 1029 4 ${{ matrix.lo }} ${{ matrix.hi }}
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::x62 exited with code $rc"
            exit "$rc"
          fi
          exit 0
