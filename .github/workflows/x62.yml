name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-n24
  cancel-in-progress: false

jobs:
  n:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {id: 901, s: 901, w: 180, d: 2,   u: 80,  m: 0, t: 4}
          - {id: 909, s: 909, w: 200, d: 4,   u: 100, m: 4, t: 4}
          - {id: 917, s: 917, w: 220, d: 10,  u: 120, m: 0, t: 4}
          - {id: 925, s: 925, w: 260, d: 20,  u: 160, m: 1, t: 4}
          - {id: 933, s: 933, w: 320, d: 20,  u: 200, m: 4, t: 4}
          - {id: 941, s: 941, w: 400, d: 50,  u: 0,   m: 0, t: 4}
          - {id: 949, s: 949, w: 500, d: 50,  u: 0,   m: 1, t: 4}
          - {id: 957, s: 957, w: 600, d: 100, u: 0,   m: 4, t: 4}
          - {id: 965, s: 965, w: 800, d: 100, u: 0,   m: 0, t: 4}
          - {id: 973, s: 973, w: 1029,d: 100, u: 0,   m: 4, t: 4}
    name: n-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 44m python3 x62/n.py x62/d ${{ matrix.s }} 2520 x62/r ${{ matrix.w }} ${{ matrix.d }} ${{ matrix.u }} ${{ matrix.m }} ${{ matrix.t }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/r || true
          if grep -q '^FOUND$' x62/r 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n-${{ matrix.id }}
          path: |
            x62/r
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
