name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'x62/**'
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-main
  cancel-in-progress: false

jobs:
  prep:
    name: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: check
        shell: bash
        run: |
          set -euo pipefail
          test -s x62/b.py
          test -s x62/c.py
          test -s x62/d
          test "$(wc -l < x62/d)" -eq 1029
          echo "fd7f67051b817842f5795fae812b852efa8007f5478a286365a7236a6a790cd8  x62/d" | sha256sum -c -
          python3 -m py_compile x62/b.py x62/c.py
          python3 x62/b.py x62/d check

      - name: deps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x62/w
          for attempt in 1 2 3; do
            rm -f x62/w/*
            if python3 -m pip download --disable-pip-version-check --only-binary=:all: --dest x62/w ortools==9.15.6755; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::dependency download failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf x62/s
          python3 -m pip install --disable-pip-version-check --no-index --find-links x62/w --target x62/s ortools==9.15.6755
          PYTHONPATH="$PWD/x62/s" python3 -c 'import ortools; print(ortools.__version__)'
          set +e
          PYTHONPATH="$PWD/x62/s:$PWD/x62" python3 x62/c.py x62/d 6204999 30 x62/t d 1 0 0
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::smoke exited with code $rc"
            exit "$rc"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: x62-runtime
          path: |
            x62/b.py
            x62/c.py
            x62/d
            x62/w
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  r:
    needs: prep
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: 0,  seed: 6204100, order: d, rref: 1, quick: 0, fix: 0}
          - {id: 1,  seed: 6204101, order: d, rref: 1, quick: 0, fix: 0}
          - {id: 2,  seed: 6204102, order: d, rref: 1, quick: 0, fix: 0}
          - {id: 3,  seed: 6204103, order: d, rref: 1, quick: 0, fix: 0}
          - {id: 4,  seed: 6204104, order: d, rref: 1, quick: 0, fix: 0}
          - {id: 5,  seed: 6204105, order: d, rref: 1, quick: 0, fix: 0}
          - {id: 6,  seed: 6204110, order: a, rref: 1, quick: 0, fix: 0}
          - {id: 7,  seed: 6204111, order: a, rref: 1, quick: 0, fix: 0}
          - {id: 8,  seed: 6204112, order: a, rref: 1, quick: 0, fix: 0}
          - {id: 9,  seed: 6204113, order: a, rref: 1, quick: 0, fix: 0}
          - {id: 10, seed: 6204114, order: a, rref: 1, quick: 0, fix: 0}
          - {id: 11, seed: 6204115, order: a, rref: 1, quick: 0, fix: 0}
          - {id: 12, seed: 6204120, order: r, rref: 1, quick: 0, fix: 0}
          - {id: 13, seed: 6204121, order: r, rref: 1, quick: 0, fix: 0}
          - {id: 14, seed: 6204122, order: r, rref: 1, quick: 0, fix: 0}
          - {id: 15, seed: 6204123, order: r, rref: 1, quick: 0, fix: 0}
          - {id: 16, seed: 6204130, order: d, rref: 0, quick: 0, fix: 0}
          - {id: 17, seed: 6204131, order: a, rref: 0, quick: 0, fix: 0}
          - {id: 18, seed: 6204138, order: d, rref: 1, quick: 1, fix: 0}
          - {id: 19, seed: 6204139, order: d, rref: 1, quick: 0, fix: 8}

    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x62-runtime
          path: x62

      - name: run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf x62/s
          python3 -m pip install --disable-pip-version-check --no-index --find-links x62/w --target x62/s ortools==9.15.6755
          set +e
          PYTHONPATH="$PWD/x62/s:$PWD/x62" python3 x62/c.py x62/d ${{ matrix.seed }} 600 x62/z ${{ matrix.order }} ${{ matrix.rref }} ${{ matrix.quick }} ${{ matrix.fix }} >x62/l 2>&1
          rc=$?
          set -e
          cat x62/l
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::x62 exited with code $rc"
            exit "$rc"
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x62-${{ matrix.id }}
          path: |
            x62/z
            x62/l
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
