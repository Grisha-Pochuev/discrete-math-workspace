name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: x62-v29
  cancel-in-progress: false

jobs:
  v:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: 1501, s: 1501, f: 13}
          - {id: 1509, s: 1509, f: 13}
          - {id: 1517, s: 1517, f: 13}
          - {id: 1525, s: 1525, f: 13}
          - {id: 1533, s: 1533, f: 14}
          - {id: 1541, s: 1541, f: 14}
          - {id: 1549, s: 1549, f: 14}
          - {id: 1557, s: 1557, f: 20}
          - {id: 1565, s: 1565, f: 20}
          - {id: 1573, s: 1573, f: 20}
          - {id: 1581, s: 1581, f: 21}
          - {id: 1589, s: 1589, f: 21}
          - {id: 1597, s: 1597, f: 21}
          - {id: 1605, s: 1605, f: 24}
          - {id: 1613, s: 1613, f: 24}
          - {id: 1621, s: 1621, f: 15}
          - {id: 1629, s: 1629, f: 15}
          - {id: 1637, s: 1637, f: 11}
          - {id: 1645, s: 1645, f: 4}
          - {id: 1653, s: 1653, f: 22}
    name: v-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: r
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p x62/a
          for b in 0 1 2 3 4 5 6 7; do
            gh run download 33345107048 -n "z-$b" -D "x62/a/z-$b"
          done
          python3 x62/t.py x62/d x62/z x62/f
          g++ -O3 -march=native -std=c++17 x62/w.cpp -o x62/w
          set +e
          pids=""
          for j in 0 1 2 3; do
            sd=$(( ${{ matrix.s }} + 100003*j ))
            timeout 40m x62/w x62/z x62/f "$sd" 460 ${{ matrix.f }} "x62/out$j" x62/a/z-0/o x62/a/z-1/o x62/a/z-2/o x62/a/z-3/o x62/a/z-4/o x62/a/z-5/o x62/a/z-6/o x62/a/z-7/o >"x62/log$j" 2>&1 &
            pids="$pids $!"
          done
          for p in $pids; do wait "$p" || true; done
          set -e
          cat x62/out* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v-${{ matrix.id }}
          path: |
            x62/out*
            x62/log*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
