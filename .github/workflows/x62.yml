name: x62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x62.yml'

permissions:
  contents: read

concurrency:
  group: x62-main
  cancel-in-progress: false

jobs:
  j:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {s: 6201, m: 0}
          - {s: 6209, m: 1}
          - {s: 6221, m: 2}
          - {s: 6229, m: 3}
    name: j-${{ matrix.s }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x62
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: d
        shell: bash
        run: python3 -m pip install -q ortools==9.14.6206
      - name: r
        shell: bash
        run: |
          set +e
          timeout 27m python3 x62/j.py x62/d ${{ matrix.s }} 1560 x62/r ${{ matrix.m }} >x62/stdout 2>&1
          rc=$?
          set -e
          cat x62/stdout || true
          cat x62/r || true
          if grep -q '^FOUND$' x62/r 2>/dev/null; then exit 0; fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j-${{ matrix.s }}
          path: |
            x62/r
            x62/stdout
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
