name: Mona Lisa TSP LKH record search v2

on:
  push:
    branches: [monalisa-tsp-search-2026-09-03]
    paths:
      - '.github/workflows/monalisa-lkh-search-v2.yml'

permissions:
  contents: read

jobs:
  improve-tour:
    name: LKH-v2 ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: sparse-fast, mode: sparse, seed: 1103, move: 5, submove: 5, nonseq: 9, pc: 5, pa: 2, breadth: 100, backtracking: 'NO', kicks: 1}
          - {name: sparse-wide, mode: sparse, seed: 2207, move: 5, submove: 5, nonseq: 9, pc: 5, pa: 2, breadth: 1000, backtracking: 'YES', kicks: 1}
          - {name: sparse-six-opt, mode: sparse, seed: 3301, move: 6, submove: 5, nonseq: 12, pc: 6, pa: 3, breadth: 200, backtracking: 'NO', kicks: 4}
          - {name: full-delaunay, mode: delaunay, seed: 4409, move: 5, submove: 5, nonseq: 9, pc: 5, pa: 2, breadth: 300, backtracking: 'NO', kicks: 4}
          - {name: full-popmusic, mode: popmusic, seed: 5501, move: 5, submove: 5, nonseq: 9, pc: 5, pa: 2, breadth: 300, backtracking: 'NO', kicks: 4}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download verified public inputs
        shell: bash
        run: |
          set -euo pipefail
          data='monalisa-tsp-search/lkh-data'
          out='monalisa-tsp-search/lkh-output-v2/${{ matrix.name }}'
          mkdir -p "$data" "$out"
          rr='https://raw.githubusercontent.com/Hermann-SW/RR/main/data/tsp/extra'
          elim='https://raw.githubusercontent.com/bicobico2/ElimTSP/main/results'
          curl -fL --retry 5 --retry-all-errors "$rr/mona-lisa100K.tsp" -o "$data/mona-lisa100K.tsp"
          curl -fL --retry 5 --retry-all-errors "$rr/mona-lisa100K.opt.tour" -o "$data/record.tour"
          curl -fL --retry 5 --retry-all-errors "$elim/mona.248972.edg.gz" -o "$data/mona.248972.edg.gz"
          sha256sum "$data"/* | tee "$out/input-sha256.txt"

      - name: Convert published graph to LKH candidates
        shell: bash
        run: |
          set -euo pipefail
          python monalisa-tsp-search/prepare_lkh_data.py \
            --edges monalisa-tsp-search/lkh-data/mona.248972.edg.gz \
            --tour monalisa-tsp-search/lkh-data/record.tour \
            --candidate monalisa-tsp-search/lkh-data/mona.cand \
            --report monalisa-tsp-search/lkh-output-v2/${{ matrix.name }}/candidate-report.json

      - name: Build pinned LKH 2.0.11
        shell: bash
        run: |
          set -euo pipefail
          commit='3c99645b60c406372fb88ddb4e4e311636475791'
          curl -fL --retry 5 --retry-all-errors \
            "https://codeload.github.com/k1ngofdarks/TSP-Solvers/tar.gz/$commit" \
            -o /tmp/TSP-Solvers.tar.gz
          tar -xzf /tmp/TSP-Solvers.tar.gz -C /tmp
          src="/tmp/TSP-Solvers-$commit/LKH-2.0.11"
          test -f "$src/README.txt"
          mkdir -p "$src/SRC/OBJ"
          make -C "$src"
          test -x "$src/LKH"
          printf '%s\n' "$src" >/tmp/lkh-src-path
          sha256sum /tmp/TSP-Solvers.tar.gz "$src/LKH" \
            | tee monalisa-tsp-search/lkh-output-v2/${{ matrix.name }}/lkh-binary-sha256.txt

      - name: Write targeted parameters
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/monalisa-tsp-search/lkh-output-v2/${{ matrix.name }}"
          data="$PWD/monalisa-tsp-search/lkh-data"
          cat >"$out/search.par" <<EOF
          PROBLEM_FILE = $data/mona-lisa100K.tsp
          INITIAL_TOUR_FILE = $data/record.tour
          TOUR_FILE = $out/result.tour
          TRACE_LEVEL = 2
          SEED = ${{ matrix.seed }}
          RUNS = 1
          MAX_TRIALS = 1000000
          TIME_LIMIT = 1050
          MOVE_TYPE = ${{ matrix.move }}
          SUBSEQUENT_MOVE_TYPE = ${{ matrix.submove }}
          NONSEQUENTIAL_MOVE_TYPE = ${{ matrix.nonseq }}
          PATCHING_C = ${{ matrix.pc }}
          PATCHING_A = ${{ matrix.pa }}
          MAX_BREADTH = ${{ matrix.breadth }}
          BACKTRACKING = ${{ matrix.backtracking }}
          GAIN23 = YES
          RESTRICTED_SEARCH = NO
          KICK_TYPE = 4
          KICKS = ${{ matrix.kicks }}
          EOF
          case '${{ matrix.mode }}' in
            sparse)
              cat >>"$out/search.par" <<EOF
          CANDIDATE_FILE = $data/mona.cand
          MAX_CANDIDATES = 20
          EOF
              ;;
            delaunay)
              cat >>"$out/search.par" <<EOF
          CANDIDATE_SET_TYPE = DELAUNAY PURE
          MAX_CANDIDATES = 20
          EXTRA_CANDIDATES = 8 SYMMETRIC
          EXTRA_CANDIDATE_SET_TYPE = QUADRANT
          EOF
              ;;
            popmusic)
              cat >>"$out/search.par" <<EOF
          CANDIDATE_SET_TYPE = POPMUSIC
          MAX_CANDIDATES = 20
          POPMUSIC_SAMPLE_SIZE = 100
          POPMUSIC_SOLUTIONS = 50
          POPMUSIC_MAX_NEIGHBORS = 20
          POPMUSIC_TRIALS = 5
          EXTRA_CANDIDATES = 5 SYMMETRIC
          EXTRA_CANDIDATE_SET_TYPE = QUADRANT
          EOF
              ;;
          esac
          cat "$out/search.par"

      - name: Run record search
        shell: bash
        run: |
          set +e
          out="$PWD/monalisa-tsp-search/lkh-output-v2/${{ matrix.name }}"
          lkh="$(cat /tmp/lkh-src-path)/LKH"
          timeout --signal=INT --kill-after=30s 22m "$lkh" "$out/search.par" 2>&1 | tee "$out/lkh.log"
          code=${PIPESTATUS[0]}
          echo "$code" >"$out/lkh-exit-code.txt"
          if [ ! -s "$out/result.tour" ]; then
            cp monalisa-tsp-search/lkh-data/record.tour "$out/result.tour"
            echo 'No emitted tour; reference copied only so the verifier can report safely.' >"$out/no-result-note.txt"
          fi
          exit 0

      - name: Independently verify result
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/monalisa-tsp-search/lkh-output-v2/${{ matrix.name }}"
          python monalisa-tsp-search/verify_lkh_tour.py \
            --instance monalisa-tsp-search/lkh-data/mona-lisa100K.tsp \
            --candidate "$out/result.tour" \
            --reference monalisa-tsp-search/lkh-data/record.tour \
            --report "$out/verified-result.json" \
            --normalized-tour "$out/verified-result.tour" \
            --target 5757191
          cat "$out/verified-result.json"

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monalisa-lkh-v2-${{ matrix.name }}
          path: monalisa-tsp-search/lkh-output-v2/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 30
