name: Fourth approach watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows:
      - 'Fourth approach real-path smoke'
      - 'Fourth approach compute'
      - 'Rescue Fourth approach collection'
    types: [completed]
  push:
    paths:
      - '.github/workflows/fourth-approach-watchdog.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: fourth-approach-watchdog
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Clone only the control plane
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=100 --filter=blob:none origin main
          git sparse-checkout init --cone
          git sparse-checkout set fourth-approach
          git checkout -B main FETCH_HEAD

      - name: Inspect state and perform at most one missing transition
        shell: bash
        run: |
          set -euo pipefail

          active_smoke="$(gh run list --repo "$GH_REPO" --workflow fourth-approach-smoke.yml --limit 30 --json status --jq '[.[] | select(.status != "completed")] | length')"
          active_compute="$(gh run list --repo "$GH_REPO" --workflow fourth-approach-compute.yml --limit 30 --json status --jq '[.[] | select(.status != "completed")] | length')"
          active_rescue="$(gh run list --repo "$GH_REPO" --workflow fourth-approach-rescue.yml --limit 30 --json status --jq '[.[] | select(.status != "completed")] | length')"
          active_large="$(gh run list --repo "$GH_REPO" --limit 100 --json status,workflowName --jq '[.[] | select(.status != "completed" and (.workflowName == "Third approach 2.0 proof search" or .workflowName == "Third approach proof search" or .workflowName == "Second approach compute" or .workflowName == "Second approach 2.0 compute"))] | length')"

          export ACTIVE_SMOKE="$active_smoke" ACTIVE_COMPUTE="$active_compute" ACTIVE_RESCUE="$active_rescue" ACTIVE_LARGE="$active_large"
          decision="$(PYTHONPATH=fourth-approach python - <<'PY'
          import json, os
          from pathlib import Path
          from schema import launch_from_spec, read_json, validate_launch, validate_spec

          root = Path('fourth-approach')
          control = read_json(root / 'control.json')
          launch = validate_launch(read_json(root / 'launch.json'))
          state = read_json(root / 'watchdog-state.json')
          next_index = int(control.get('next_run_index', -1))
          next_spec_path = str(control.get('next_spec_path', ''))
          mismatch = int(launch['run_index']) != next_index or str(launch['spec_path']) != next_spec_path

          if mismatch:
              if not next_spec_path:
                  print('HALT_MISSING_NEXT_SPEC')
                  raise SystemExit
              spec = validate_spec(read_json(next_spec_path))
              repaired = launch_from_spec(next_spec_path, spec, enabled=False, nonce=f"fourth-run-{int(spec['run_index']):03d}-disabled-watchdog-repair")
              (root / 'launch.json').write_text(json.dumps(repaired, indent=2, sort_keys=True) + '\n')
              state.update(last_action='repaired_control_launch_alignment', current_gate=('await_smoke_for_next_stage' if spec.get('implementation_status') == 'ready' else 'await_next_stage_implementation'), last_observed_active_runs={'smoke': int(os.environ['ACTIVE_SMOKE']), 'compute': int(os.environ['ACTIVE_COMPUTE']), 'rescue': int(os.environ['ACTIVE_RESCUE']), 'large_conflicts': int(os.environ['ACTIVE_LARGE'])})
              (root / 'watchdog-state.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
              print('COMMIT_REPAIR')
              raise SystemExit

          spec = validate_spec(read_json(launch['spec_path']))
          if spec.get('implementation_status') != 'ready':
              print('WAIT_IMPLEMENTATION')
              raise SystemExit
          validate_spec(spec, launch, require_ready=True)

          if int(os.environ['ACTIVE_COMPUTE']) or int(os.environ['ACTIVE_RESCUE']):
              print('WAIT_ACTIVE_COMPUTE_OR_RESCUE')
              raise SystemExit
          if int(os.environ['ACTIVE_LARGE']):
              print('WAIT_LARGE_CONFLICT')
              raise SystemExit

          smoke_path = root / 'smoke-status.json'
          smoke = read_json(smoke_path) if smoke_path.exists() else {}
          smoke_matches = smoke.get('result') == 'success' and int(smoke.get('run_index', -1)) == int(launch['run_index']) and str(smoke.get('task', '')) == str(launch['task'])
          if not smoke_matches or bool(control.get('smoke_required', True)):
              print('DISPATCH_SMOKE' if not int(os.environ['ACTIVE_SMOKE']) else 'WAIT_ACTIVE_SMOKE')
              raise SystemExit
          if not launch['enabled']:
              print('ENABLE_AND_DISPATCH_COMPUTE')
              raise SystemExit
          print('CHECK_EXISTING_COMPUTE')
          PY
          )"

          {
            echo "decision=${decision}"
            echo "active_smoke=${active_smoke}"
            echo "active_compute=${active_compute}"
            echo "active_rescue=${active_rescue}"
            echo "active_large=${active_large}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          case "$decision" in
            COMMIT_REPAIR)
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add fourth-approach/launch.json fourth-approach/watchdog-state.json
              git commit -m 'repair Fourth approach successor state after accepted run'
              for attempt in 1 2 3 4; do
                if git push origin HEAD:main; then exit 0; fi
                if [ "$attempt" = 4 ]; then exit 1; fi
                git -c protocol.version=2 fetch --no-tags --depth=100 --filter=blob:none origin main
                git rebase origin/main
              done
              ;;
            DISPATCH_SMOKE)
              gh workflow run fourth-approach-smoke.yml --repo "$GH_REPO" --ref main
              echo 'Dispatched exactly one missing real-path smoke.' | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            ENABLE_AND_DISPATCH_COMPUTE)
              python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('fourth-approach')
          launch = json.loads((root / 'launch.json').read_text())
          control = json.loads((root / 'control.json').read_text())
          state = json.loads((root / 'watchdog-state.json').read_text())
          if int(launch['run_index']) != int(control['next_run_index']): raise SystemExit('launch/control mismatch')
          launch['enabled'] = True
          launch['nonce'] = f"fourth-run-{int(launch['run_index']):03d}-watchdog-{int(datetime.now(timezone.utc).timestamp())}"
          state['last_action'] = 'enabled_and_requested_compute_after_green_smoke'
          state['current_gate'] = 'compute_dispatch_requested'
          state['dispatch_requested_for_nonce'] = launch['nonce']
          state['dispatch_requested_at'] = datetime.now(timezone.utc).isoformat()
          (root / 'launch.json').write_text(json.dumps(launch, indent=2, sort_keys=True) + '\n')
          (root / 'watchdog-state.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
          PY
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add fourth-approach/launch.json fourth-approach/watchdog-state.json
              git commit -m 'enable one Fourth approach run after verified smoke'
              for attempt in 1 2 3 4; do
                if git push origin HEAD:main; then break; fi
                if [ "$attempt" = 4 ]; then exit 1; fi
                git -c protocol.version=2 fetch --no-tags --depth=100 --filter=blob:none origin main
                git rebase origin/main
              done
              gh workflow run fourth-approach-compute.yml --repo "$GH_REPO" --ref main
              echo 'Enabled and dispatched exactly one compute run.' | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            CHECK_EXISTING_COMPUTE)
              smoke_time="$(jq -r '.completed_at // ""' fourth-approach/smoke-status.json)"
              recent="$(gh run list --repo "$GH_REPO" --workflow fourth-approach-compute.yml --limit 30 --json databaseId,status,conclusion,createdAt --jq --arg t "$smoke_time" '[.[] | select(.createdAt >= $t)]')"
              count="$(jq 'length' <<<"$recent")"
              if [ "$count" -eq 0 ]; then
                gh workflow run fourth-approach-compute.yml --repo "$GH_REPO" --ref main
                echo 'Recovered a missing compute dispatch for an enabled launch.' | tee -a "$GITHUB_STEP_SUMMARY"
              else
                latest_status="$(jq -r 'sort_by(.createdAt) | last | .status' <<<"$recent")"
                latest_conclusion="$(jq -r 'sort_by(.createdAt) | last | .conclusion // ""' <<<"$recent")"
                latest_id="$(jq -r 'sort_by(.createdAt) | last | .databaseId' <<<"$recent")"
                if [ "$latest_status" = 'completed' ]; then
                  echo "Compute ${latest_id} completed (${latest_conclusion}) but successor state did not advance. Do not recompute; inspect collection and use rescue if needed." | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
              fi
              ;;
            WAIT_*|HALT_*|WAIT_IMPLEMENTATION)
              ;;
            *) echo "Unknown watchdog decision: $decision" >&2; exit 2 ;;
          esac
