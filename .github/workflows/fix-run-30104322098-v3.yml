name: publish validated code fix for run 30104322098

on:
  push:
    branches: [main]
    paths:
      - ".fix/30104322098-v3.txt"

permissions:
  contents: write

concurrency:
  group: fix-run-30104322098-v3
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse and validate the already tested correction
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyyaml
          python - <<'PY'
          import subprocess
          import yaml

          with open('.github/workflows/fix-run-30104322098.yml', encoding='utf-8') as source:
              workflow = yaml.safe_load(source)
          steps = workflow['jobs']['patch']['steps']
          for index in (1, 2):
              script = steps[index]['run']
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY

      - name: Publish isolated non-workflow fix branch
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/fix-30104322098"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch already exists: $branch" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add search.cpp batch.py collect_run.py AGENTS.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix 64-bit shard frontier after 30104322098"
          git push origin "HEAD:$branch"
          printf 'branch=%s\ncommit=%s\n' "$branch" "$(git rev-parse HEAD)" | tee fix-branch.env

      - name: Upload validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-30104322098-${{ github.run_id }}
          path: fix-branch.env
          if-no-files-found: warn
          retention-days: 7
