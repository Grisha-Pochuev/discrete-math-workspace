name: e07 trigger

on:
  push:
    paths:
      - '.github/workflows/e07-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
      CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
    steps:
      - name: trigger
        shell: bash
        run: |
          set -euo pipefail
          token="${CIRCLE_TOKEN:-${CIRCLECI_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo 'No configured external API token under the two expected secret names.' >&2
            exit 2
          fi
          curl --fail-with-body --silent --show-error \
            -X POST 'https://circleci.com/api/v2/project/circleci/TnU6xPTn3bJog4b7KxfhCA/YQB6nBJVUKZPiUhmaiznzU/pipeline/run' \
            -H "Circle-Token: $token" \
            -H 'content-type: application/json' \
            --data '{"definition_id":"14c2864b-6de2-4891-a87a-80b99c8efec5","config":{"branch":"e07-r0"},"checkout":{"branch":"e07-r0"}}'
